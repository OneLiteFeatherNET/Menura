# Serves the built single-page app from the web image (see web/Dockerfile).
# Unprivileged nginx listens on 8080 as uid 101, the port the chart's web container declares.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers for every response; see nginx/security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # Vite fingerprints the file names under assets/, so they can be cached forever.
    # A missing asset is a 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # This location has its own add_header, so the server's headers are not inherited here.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: every other path that is not a file gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
