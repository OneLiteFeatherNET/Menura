name: chart

# Deploy checks on every pull request: the Helm chart (lint, render and the assertions of the public
# surface), the rendered manifests against the Kubernetes schemas, the development compose file, and
# the static checks of the container images. None of them needs a cluster or a running stack.

on:
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render the chart
        run: deploy/check-helm.sh

      # kubeconform checks the manifests against the Kubernetes schemas. The Gateway API resources are
      # CRDs without a schema here, so they are skipped rather than failing the check.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate the rendered manifests
        run: |
          helm template menura deploy/helm/menura > "$RUNNER_TEMP/rendered.yaml"
          kubeconform -strict -summary -ignore-missing-schemas "$RUNNER_TEMP/rendered.yaml"

  compose-and-images:
    name: Compose and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the development compose file
        run: deploy/check-compose.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # check-images.sh reads the server Dockerfile that Gradle generates.
      - name: Prepare the server image context
        run: ./gradlew :server:buildLayers :server:dockerfile

      - name: Check the container images
        run: deploy/check-images.sh
