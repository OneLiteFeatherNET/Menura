# Throw-away prototype: publishes the server, jobs and web images of the branch prototype/recognition to
# Harbor under the tag prototype-<short sha> (plus the sha-<short sha> tag of docker-publish), for the internal
# menura-dev release. It never pushes a semver tag or latest, so the production release (0.2.x) is untouched.
# Same reusable workflows and pins as release-please.yml. Remove together with the prototype branch.
name: Prototype images

on:
  push:
    branches: [prototype/recognition]

permissions:
  contents: read

concurrency:
  group: prototype-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve prototype tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=prototype-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-server-context:
    name: Build server Docker context
    needs: version
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ needs.version.outputs.tag }}
      gradle-command: "./gradlew :server:buildLayers :server:dockerfile -Pversion=$VERSION"
      context-path: "server/build/docker/main"
      artifact-name: "docker-context-server"
      java-version: "25.0.3"
      java-distribution: "temurin"

  build-jobs-context:
    name: Build jobs Docker context
    needs: version
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ needs.version.outputs.tag }}
      gradle-command: "./gradlew :jobs:installDist -Pversion=$VERSION"
      context-path: "jobs/build/install/jobs"
      artifact-name: "docker-context-jobs"
      java-version: "25.0.3"
      java-distribution: "temurin"

  image-server:
    name: Publish server image
    needs: [version, build-server-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-server"
      version: ${{ needs.version.outputs.tag }}
      context: "server/build/docker/main"
      artifact-name: "docker-context-server"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  image-jobs:
    name: Publish jobs image
    needs: [version, build-jobs-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-jobs"
      version: ${{ needs.version.outputs.tag }}
      context: "jobs/build/install/jobs"
      dockerfile: "jobs/Dockerfile"
      artifact-name: "docker-context-jobs"
      blob-chunk: "90000000"
      req-concurrent: "4"
    secrets: inherit

  image-web:
    name: Publish web image
    needs: version
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-web"
      version: ${{ needs.version.outputs.tag }}
      context: "."
      dockerfile: "web/Dockerfile"
    secrets: inherit
