name: release-please

# One release for the whole repository. release-please keeps the release pull request up to date on
# main; when it is merged, the release is created, and the images, the SBOM and the release asset are
# published in the same run, each gated on release_created. Tags created with GITHUB_TOKEN start no
# workflow, so nothing here listens for a tag push.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.9.1

  # Gradle writes the optimised Docker context of the server; docker-publish builds it.
  build-server-context:
    name: Build server Docker context
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ needs.release-please.outputs.version }}
      gradle-command: "./gradlew :server:buildLayers :server:dockerfile -Pversion=$VERSION"
      context-path: "server/build/docker/main"
      artifact-name: "docker-context-server"
      java-version: "25.0.3"
      java-distribution: "temurin"

  # Gradle installs the jobs distribution (bin and lib); jobs/Dockerfile copies it onto the base image.
  build-jobs-context:
    name: Build jobs Docker context
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ needs.release-please.outputs.version }}
      gradle-command: "./gradlew :jobs:installDist -Pversion=$VERSION"
      context-path: "jobs/build/install/jobs"
      artifact-name: "docker-context-jobs"
      java-version: "25.0.3"
      java-distribution: "temurin"

  image-server:
    name: Publish server image
    needs: [release-please, build-server-context]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-server"
      version: ${{ needs.release-please.outputs.version }}
      context: "server/build/docker/main"
      artifact-name: "docker-context-server"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  image-jobs:
    name: Publish jobs image
    needs: [release-please, build-jobs-context]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-jobs"
      version: ${{ needs.release-please.outputs.version }}
      context: "jobs/build/install/jobs"
      dockerfile: "jobs/Dockerfile"
      artifact-name: "docker-context-jobs"
      blob-chunk: "90000000"
      req-concurrent: "4"
    secrets: inherit

  # The web image builds from the repository root in one step, with its own multi-stage Dockerfile.
  image-web:
    name: Publish web image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/menura-web"
      version: ${{ needs.release-please.outputs.version }}
      context: "."
      dockerfile: "web/Dockerfile"
    secrets: inherit

  # The CycloneDX inventory of the released tag. Trivy generates it; it is attached to the release and
  # handed to the SBOM job below as an artifact, so the release and Dependency-Track get the same file.
  sbom-generate:
    name: Generate SBOM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: bom.json
          # An SBOM is an inventory, not a finding list. security.yml is what reports vulnerabilities.
          exit-code: '0'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: bom.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach the SBOM to the release
        run: gh release upload "$TAG" bom.json --clobber

  sbom-publish:
    name: Publish SBOM
    needs: [release-please, sbom-generate]
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Menura"
      project-version: ${{ needs.release-please.outputs.version }}
      artifact-name: "sbom-cyclonedx"
      sbom-path: "bom.json"
      is-latest: true
    secrets: inherit
