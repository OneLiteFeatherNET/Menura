name: security

# Trivy scan of the repository for vulnerabilities and secrets. It is report-only: findings reach code
# scanning and the job summary, and never fail a check yet. It runs on pull requests, on main and
# weekly, so new advisories surface without a change to the code.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "56 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan
    permissions:
      contents: read
      security-events: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/security-scan.yml@v2.9.1
    with:
      scan-type: "fs"
      scanners: "vuln,secret"
      severity: "CRITICAL,HIGH"
      fail-on-findings: false
      # Code scanning uploads need Advanced Security on a private repository; without it the job
      # summary is the report.
      upload-sarif: ${{ !github.event.repository.private }}
