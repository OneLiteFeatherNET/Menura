name: build

# Pull request checks. The Gradle modules run their unit tests without the integration tests, the
# integration tests run after them in their own job, and the web app runs its checks. The chart,
# compose and image checks are in chart.yml.

on:
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    name: Gradle
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # One Gradle run covers core, server and jobs. verifyLayout and the contract tests are part of check.
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.9.1
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
      run-tests: true
      gradle-task: "check -PexcludeTags=integration"
      runs-on: '["ubuntu-latest"]'

  integration:
    name: Integration tests
    needs: gradle
    # After the unit tests, and skipped only when they failed. It still runs when the Gradle job was
    # skipped by its path filter, because the integration tests cover the same modules.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Testcontainers starts PostgreSQL 17 on the Docker daemon of the runner. The integration tests
      # are selected by class name, as the README describes; the tag is what check excludes.
      - name: Run integration tests
        run: ./gradlew :jobs:test --tests '*IntegrationTest'

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      # The pnpm version of web/package.json `packageManager`, as the web image installs it.
      - name: Install pnpm
        run: npm install --global pnpm@10.33.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The workbench and the end-to-end suite. Storybook's play functions and the Playwright tests run in Chromium only.
  # The server runs in environment e2e with its own PostgreSQL 17 container (Testcontainers, the runner has Docker).
  # The static workbench is uploaded on every run; traces of a failed end-to-end test are uploaded when the job fails.
  workbench:
    name: Workbench and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The end-to-end suite starts the server from its installed distribution.
      - name: Install the server distribution
        run: ./gradlew :server:installDist

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.33.4

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The browser cache is keyed by the Playwright version, so a new version installs its own Chromium.
      - name: Read the Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the system libraries of Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Storybook interaction and accessibility tests
        working-directory: web
        run: pnpm test-storybook

      - name: Build the static workbench
        working-directory: web
        run: pnpm build-storybook

      - name: Upload the static workbench
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: web/storybook-static
          retention-days: 14

      - name: End-to-end tests
        working-directory: web
        run: pnpm test-e2e

      - name: Upload the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14
