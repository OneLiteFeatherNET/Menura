        metric:
          $ref: "#/components/schemas/AnalyticsMetricName"
        value:
          type:
            - integer
            - "null"
        asOf:
          type: string
          format: date-time
        ageMinutes:
          type: integer
    AnalyticsPost:
      type: object
      required:
        - postId
        - channelId
        - platform
        - format
        - title
        - url
        - publishedAt
        - removedAt
        - latest
        - snapshots
      properties:
        postId:
          $ref: "#/components/schemas/Identifier"
        channelId:
          $ref: "#/components/schemas/Identifier"
        platform:
          type: string
        format:
          type: string
        title:
          type: string
        url:
          type:
            - string
            - "null"
          description: The platform link. Null for a removed post.
        publishedAt:
          type: string
          format: date-time
        removedAt:
          type:
            - string
            - "null"
          format: date-time
        latest:
          type: array
          description: The latest value of each metric the platform provided. A metric missing here is unavailable.
          items:
            $ref: "#/components/schemas/AnalyticsValue"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSnapshot"
    AnalyticsPoints:
      type: object
      required:
        - postId
