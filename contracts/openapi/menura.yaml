openapi: 3.1.0
info:
  title: Menura API
  version: 0.1.0
  summary: Content and stream tooling of OneLiteFeather.
  description: |
    Source of truth for every REST endpoint of Menura. The server serves this file unchanged on the anonymous
    documentation path /openapi/menura.yaml. Conventions for errors, identifiers, paging and timestamps are in
    CONVENTIONS.md next to this file. The skeleton defines only the health endpoint; product endpoints are added
    by their own changes.
servers:
  - url: https://api-menura.onelitefeather.net
    description: Production, behind the shared Envoy Gateway.
  - url: http://localhost:8080
    description: Local development server.
tags:
  - name: Health
    description: Anonymous liveness and readiness.
  - name: Auth
    description: Web sign-in through Menura's authorization server (backend-for-frontend session).
  - name: Calendar
    description: Calendar feed tokens for read-only calendar subscriptions.
  - name: Library
    description: Finished assets and raw material, uploaded by presigned multipart upload straight to the object storage.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness and readiness of the server and its database.
      description: |
        Anonymous. Answers 200 when the database is reachable and 503 when it is not. The body reveals only the
        overall status and the database readiness: no version, host or configuration.
      security: []
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    get:
      tags:
        - Auth
      operationId: startSignIn
      summary: Starts a web sign-in with Entra ID.
      description: |
        Anonymous. Records the sign-in transaction on the server (state, nonce and PKCE verifier, kept as digests or
        server-side only) and redirects the browser to the Entra ID authorization endpoint. No token is issued here.
      security: []
      responses:
        "302":
          description: Redirect to Entra ID.
          headers:
            Location:
              description: The Entra ID authorization URL with state, nonce and an S256 code challenge.
              schema:
                type: string
                format: uri
          content: {}
        "503":
          description: Sign-in with Entra ID is not configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/callback:
    get:
      tags:
        - Auth
      operationId: completeSignIn
      summary: Completes a web sign-in and sets the session cookie.
      description: |
        Anonymous, reached through the redirect of Entra ID. The state must belong to a live sign-in transaction, which
        is used up by this call. On success the server holds the Menura access token and the browser receives only
        the `__Host-menura-session` cookie: Secure, HttpOnly, SameSite=Strict, Path=/ and no Domain.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Entra ID when the person refused or the sign-in failed.
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to the web app.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The __Host-menura-session cookie.
              schema:
                type: string
          content: {}
        "400":
          description: The sign-in is unknown, expired or was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Entra ID refused the sign-in or the identity could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The person holds no Menura role.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: Entra ID could not be reached or answered incorrectly.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/session:
    get:
      tags:
        - Auth
      operationId: getSession
      summary: The signed-in person and their roles.
      description: |
        Answers the person of the session cookie. Returns the subject and the Menura roles, never a token. Anonymous
        callers receive 401; the web app sends them to sign in.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: endSession
      summary: Ends the web session on the server and clears the cookie.
      description: |
        Anonymous: it works without a session too, and then only clears the cookie.
      security: []
      responses:
        "204":
          description: The session is gone; the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared __Host-menura-session cookie (Max-Age=0).
              schema:
                type: string
          content: {}
  /calendar-feed-token:
    post:
      tags:
        - Calendar
      operationId: issueCalendarFeedToken
      summary: Issue the signed-in person's calendar feed token.
      description: |
        Shows a new 256-bit token once. Issuing replaces the person's previous token, which is refused at once. The
        response is never cached.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new token. It cannot be shown again.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCalendarFeedToken"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Calendar
      operationId: revokeCalendarFeedToken
      summary: Revoke the signed-in person's calendar feed token.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The token is revoked; calendar clients using it are refused from now on.
        "401":
          $ref: "#/components/responses/Problem"
  /calendar/feed/{token}:
    get:
      tags:
        - Calendar
      operationId: getCalendarFeed
      summary: The calendar feed of a token holder, as iCalendar.
      description: |
        Read-only. The token in the path is the credential, so the route needs no session. Unknown, revoked and rotated
        tokens are refused. The body is a placeholder until the iCalendar change lands.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The calendar feed token shown once when it was issued.
          schema:
            type: string
      responses:
        "200":
          description: The calendar feed.
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions:
    post:
      tags:
        - Library
      operationId: startAssetUpload
      summary: Starts an upload of a finished asset or raw material.
      description: |
        Editor only. The declaration is checked first; a checksum already recorded for the same uploader flags the
        upload instead (state flagged, no part URLs) until it is confirmed. Otherwise a multipart upload is created in
        the private bucket and presigned part URLs are issued, none for a part above 95 MB. The media bytes go from the
        browser straight to the storage; the server never receives them.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "201":
          description: The session was created. Its state is uploading, or flagged when the checksum is a duplicate.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          description: The file is above the raw material limit, or needs more parts than the storage allows.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /asset-upload-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetUpload
      summary: The upload session with its confirmed parts and the URLs of the parts still to send.
      description: |
        Editor only, and only for the uploader; any other caller answers 404. The confirmed parts are read from the
        storage. The upload continues with nextPart. A reload returns the same session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: cancelAssetUpload
      summary: Cancels a flagged or running upload and aborts its storage upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/duplicate-confirmation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: confirmDuplicateAssetUpload
      summary: Confirms that a flagged duplicate is intended and starts its upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The upload continues; its part URLs are in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: completeAssetUpload
      summary: Completes an upload and verifies the stored checksum.
      description: |
        Every part must be in the storage. The stored object's size and checksum are compared with the declaration: a
        match lists the asset as available; a mismatch fails the session, removes the object and answers 422.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset is available; assetId names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: The stored file does not match the declared size and checksum; nothing is listed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/Problem"
  /assets:
    get:
      tags:
        - Library
      operationId: listAssets
      summary: The assets the caller may see, newest first.
      description: |
        Any signed-in person who holds a Menura role. The library is one shared pool: finished assets and raw material
        alike are listed to every reader, and only verified uploads are listed. Listing carries metadata only;
        links are requested per asset.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of visible assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAsset
      summary: One asset.
      description: A hidden asset answers 404, the same as an unknown one.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: deleteAsset
      summary: Deletes an asset that no post references.
      description: |
        Editor only, and an explicit request: nothing is deleted otherwise. Refused with 409 while a post references the
        asset, naming the post. Each deletion writes one audit entry.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The asset is deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assets/{id}/preview-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetPreviewLink
      summary: A short-lived signed link to preview the asset inline.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assets/{id}/download-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetDownloadLink
      summary: A short-lived signed link to download the asset as an attachment.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-menura-session
      description: The web session cookie set by the sign-in. Its value is an opaque secret, never a token.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items per page. Values above 200 are reduced to 200.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from nextCursor of the previous page. Omit it for the first page.
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: An error, described by RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Every error response carries these five members.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the problem type; about:blank when no specific type applies.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code of the response.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence. It never contains internal details.
        instance:
          type: string
          description: The path of the request that failed.
    CursorPage:
      type: object
      description: Envelope of every cursor-paged list. nextCursor is null on the last page.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - "null"
    Identifier:
      type: string
      format: uuid
      description: A random RFC 9562 version 4 UUID. Identifiers carry no creation time and no sequence.
      example: 4f0c7a52-9d1e-4b8a-8e3f-2a6c5d7b9e10
    IssuedCalendarFeedToken:
      type: object
      description: A calendar feed token, shown once. The server keeps only its hash.
      required:
        - token
      properties:
        token:
          type: string
          description: The token as "<identifier>.<secret>"; the secret is 256 random bits.
    HealthStatus:
      type: object
      description: Overall status and database readiness. Nothing else is revealed.
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        database:
          type: string
          enum:
            - UP
            - DOWN
    SessionView:
      type: object
      description: The signed-in person. Carries no token; roles are the Menura roles the person holds.
      required:
        - subject
        - roles
      properties:
        subject:
          type: string
          description: The stable subject of the person, as issued by the authorization server.
        roles:
          type: array
          items:
            type: string
            enum:
              - VIEWER
              - EDITOR
              - PUBLISHER
              - OPERATOR
              - ADMIN
    AssetUploadRequest:
      type: object
      description: What an editor declares to start an upload. Every field is checked; a missing one is named in the problem.
      required:
        - kind
        - format
        - sizeBytes
        - checksum
        - width
        - height
      properties:
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
          description: The container or image format, in lower case (mp4, mov, webm, mkv, png, jpg, jpeg, webp or gif).
          maxLength: 16
        durationSeconds:
          type: integer
          minimum: 1
          description: Required for video and raw_material; not allowed for image. Declared by the client, never probed.
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        checksum:
          type: string
          description: The SHA-256 of the part digests, base64, then a dash and the part count, as in "base64=-3". The server compares it with the storage's own value on completion.
          pattern: "^[A-Za-z0-9+/]{43}=-[1-9][0-9]{0,4}$"
        streamTitle:
          type: string
          maxLength: 200
          description: Required for raw_material. No control or format characters.
        streamDate:
          type: string
          format: date
          description: Required for raw_material; the day of the stream.
    PartUrl:
      type: object
      description: A presigned PUT URL for one part. The browser sends the part with its x-amz-checksum-sha256 header.
      required:
        - partNumber
        - sizeBytes
        - url
        - expiresAt
      properties:
        partNumber:
          type: integer
          minimum: 1
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    UploadSessionView:
      type: object
      description: An upload session. Nullable members are always present, as null when they do not apply.
      required:
        - id
        - state
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - partSizeBytes
        - partCount
        - confirmedParts
        - parts
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            - flagged
            - uploading
            - available
            - failed
            - cancelled
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        partSizeBytes:
          type: integer
          format: int64
        partCount:
          type: integer
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        duplicateOf:
          type:
            - string
            - "null"
          format: uuid
          description: The asset the checksum already belongs to, when the upload is flagged.
        assetId:
          type:
            - string
            - "null"
          format: uuid
        failureReason:
          type:
            - string
            - "null"
          description: Why the session failed, for example checksum_mismatch.
        confirmedParts:
          type: array
          items:
            type: integer
            minimum: 1
          description: The part numbers the storage has confirmed, ascending.
        nextPart:
          type:
            - integer
            - "null"
          description: The first part not yet confirmed; null when every part is confirmed.
        parts:
          type: array
          description: Presigned URLs for the parts not yet confirmed, ascending.
          items:
            $ref: "#/components/schemas/PartUrl"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetView:
      type: object
      description: A verified asset as listed. Metadata only; links are requested separately.
      required:
        - id
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - uploaderId
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        createdAt:
          type: string
          format: date-time
    AssetPage:
      description: One cursor page of assets; the envelope is CursorPage.
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AssetView"
    SignedLink:
      type: object
      description: A signed link to one object. The storage refuses it after expiresAt.
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
