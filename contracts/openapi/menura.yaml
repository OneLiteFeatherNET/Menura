openapi: 3.1.0
info:
  title: Menura API
  version: 0.1.0
  summary: Content and stream tooling of OneLiteFeather.
  description: |
    Source of truth for every REST endpoint of Menura. The server serves this file unchanged on the anonymous
    documentation path /openapi/menura.yaml. Conventions for errors, identifiers, paging and timestamps are in
    CONVENTIONS.md next to this file. The skeleton defines only the health endpoint; product endpoints are added
    by their own changes.
servers:
  - url: https://api-menura.onelitefeather.net
    description: Production, behind the shared Envoy Gateway.
  - url: http://localhost:8080
    description: Local development server.
tags:
  - name: Health
    description: Anonymous liveness and readiness.
  - name: Auth
    description: Web sign-in through Menura's authorization server (backend-for-frontend session).
  - name: Calendar
    description: Calendar feed tokens for read-only calendar subscriptions.
  - name: Library
    description: Finished assets and raw material, uploaded by presigned multipart upload straight to the object storage.
  - name: Channels
    description: Channels of platform accounts, their connection through the platform's own consent, and their state. No response carries a token.
  - name: Platforms
    description: Platforms of this build, their capabilities and the audit status of their apps.
  - name: Brand
    description: >-
      The central brand kit: versioned colours, typography, marks, texts and layout templates. Every signed-in role
      reads it; the editor role publishes versions and sets the pins of consumers.
  - name: Content
    description: The shared pool of raw recordings and clips, person and free tags, transcript search, timelines and lineage.
  - name: Series
    description: >-
      Content series: badge, opening formula, hashtag and colour token per series; the assignment of external posts with
      their episode numbers; the weekly coverage; and the render bundle for the external renderer. Every signed-in role
      reads them; the editor role writes them.
  - name: Analytics
    description: >-
      Performance of external posts across channels, per channel, per series, and by publish hour and weekday at equal age
      (snapshots at fixed offsets after publication). Every signed-in role reads them; no endpoint changes a post.
  - name: Posts
    description: >-
      Posts planned per channel from finished assets: drafts, planning onto several channels and onto the next episodes
      of a series, the status lifecycle (draft, in review, approved, scheduled, published, failed), approval by a
      publisher in the web application only, the schedule dry run, and revisions with their acceptance. No MCP tool
      approves or publishes.
  - name: Attribution
    description: >-
      Join attribution: the network proxy reports each join with a pseudonym and may ask the player once where they found
      the network (fixed choices). The admin sets the join domain and the attribution window; every signed-in role reads
      the new-player reports and the estimates per post and series, which are estimates and say so. No player is identified.

paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness and readiness of the server and its database.
      description: |
        Anonymous. Answers 200 when the database is reachable and 503 when it is not. The body reveals only the
        overall status and the database readiness: no version, host or configuration.
      security: []
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    get:
      tags:
        - Auth
      operationId: startSignIn
      summary: Starts a web sign-in with Entra ID.
      description: |
        Anonymous. Records the sign-in transaction on the server (state, nonce and PKCE verifier, kept as digests or
        server-side only) and redirects the browser to the Entra ID authorization endpoint. No token is issued here.
      security: []
      responses:
        "302":
          description: Redirect to Entra ID.
          headers:
            Location:
              description: The Entra ID authorization URL with state, nonce and an S256 code challenge.
              schema:
                type: string
                format: uri
          content: {}
        "503":
          description: Sign-in with Entra ID is not configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/callback:
    get:
      tags:
        - Auth
      operationId: completeSignIn
      summary: Completes a web sign-in and sets the session cookie.
      description: |
        Anonymous, reached through the redirect of Entra ID. The state must belong to a live sign-in transaction, which
        is used up by this call. On success the server holds the Menura access token and the browser receives only
        the `__Host-menura-session` cookie: Secure, HttpOnly, SameSite=Strict, Path=/ and no Domain.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Entra ID when the person refused or the sign-in failed.
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to the web app.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The __Host-menura-session cookie.
              schema:
                type: string
          content: {}
        "400":
          description: The sign-in is unknown, expired or was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Entra ID refused the sign-in or the identity could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The person holds no Menura role.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: Entra ID could not be reached or answered incorrectly.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/session:
    get:
      tags:
        - Auth
      operationId: getSession
      summary: The signed-in person and their roles.
      description: |
        Answers the person of the session cookie. Returns the subject and the Menura roles, never a token. Anonymous
        callers receive 401; the web app sends them to sign in.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: endSession
      summary: Ends the web session on the server and clears the cookie.
      description: |
        Anonymous: it works without a session too, and then only clears the cookie.
      security: []
      responses:
        "204":
          description: The session is gone; the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared __Host-menura-session cookie (Max-Age=0).
              schema:
                type: string
          content: {}
  /calendar-feed-token:
    post:
      tags:
        - Calendar
      operationId: issueCalendarFeedToken
      summary: Issue the signed-in person's calendar feed token.
      description: |
        Shows a new 256-bit token once. Issuing replaces the person's previous token, which is refused at once. The
        response is never cached.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new token. It cannot be shown again.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCalendarFeedToken"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Calendar
      operationId: revokeCalendarFeedToken
      summary: Revoke the signed-in person's calendar feed token.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The token is revoked; calendar clients using it are refused from now on.
        "401":
          $ref: "#/components/responses/Problem"
  /calendar/feed/{token}:
    get:
      tags:
        - Calendar
      operationId: getCalendarFeed
      summary: The calendar feed of a token holder, as iCalendar (RFC 5545).
      description: |
        Read-only. The token in the path is the credential, so the route needs no session. It lists the planned posts
        of the next year (planned, approved and in review, scheduled) and, for a token issued by a publisher, the
        approvals due. Each event has a stable UID and a SEQUENCE that grows with every change of its post. Unknown,
        revoked, rotated and malformed tokens answer 404 with the same body. Write requests have no route. The response
        carries Referrer-Policy no-referrer; the token is redacted from logs. Each token is rate-limited and answers 429
        with Retry-After.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The calendar feed token shown once when it was issued.
          schema:
            type: string
      responses:
        "200":
          description: The calendar feed.
          content:
            text/calendar:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions:
    post:
      tags:
        - Library
      operationId: startAssetUpload
      summary: Starts an upload of a finished asset or raw material.
      description: |
        Editor only. The declaration is checked first; a checksum already recorded for the same uploader flags the
        upload instead (state flagged, no part URLs) until it is confirmed. Otherwise a multipart upload is created in
        the private bucket and presigned part URLs are issued, none for a part above 95 MB. The media bytes go from the
        browser straight to the storage; the server never receives them.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "201":
          description: The session was created. Its state is uploading, or flagged when the checksum is a duplicate.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          description: The file is above the raw material limit, or needs more parts than the storage allows.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /asset-upload-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetUpload
      summary: The upload session with its confirmed parts and the URLs of the parts still to send.
      description: |
        Editor only, and only for the uploader; any other caller answers 404. The confirmed parts are read from the
        storage. The upload continues with nextPart. A reload returns the same session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: cancelAssetUpload
      summary: Cancels a flagged or running upload and aborts its storage upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/duplicate-confirmation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: confirmDuplicateAssetUpload
      summary: Confirms that a flagged duplicate is intended and starts its upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The upload continues; its part URLs are in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: completeAssetUpload
      summary: Completes an upload and verifies the stored checksum.
      description: |
        Every part must be in the storage. The stored object's size and checksum are compared with the declaration: a
        match lists the asset as available; a mismatch fails the session, removes the object and answers 422.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset is available; assetId names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: The stored file does not match the declared size and checksum; nothing is listed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/Problem"
  /assets:
    get:
      tags:
        - Library
      operationId: listAssets
      summary: The assets the caller may see, newest first.
      description: |
        Any signed-in person who holds a Menura role. The library is one shared pool: finished assets and raw material
        alike are listed to every reader, and only verified uploads are listed. Listing carries metadata only;
        links are requested per asset.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of visible assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAsset
      summary: One asset.
      description: A hidden asset answers 404, the same as an unknown one.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: deleteAsset
      summary: Deletes an asset that no post references.
      description: |
        Editor only, and an explicit request: nothing is deleted otherwise. Refused with 409 while a post references the
        asset, naming the post. Each deletion writes one audit entry.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The asset is deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assets/{id}/preview-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetPreviewLink
      summary: A short-lived signed link to preview the asset inline.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assets/{id}/download-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetDownloadLink
      summary: A short-lived signed link to download the asset as an attachment.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /platforms:
    get:
      tags:
        - Platforms
      operationId: listPlatforms
      summary: The platforms of this build with their capabilities, features and audit status.
      description: |
        Read by every signed-in person. The restrictions of an app that is not audited are listed with its status, so
        publishers see them before they schedule.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The platforms of this build.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Problem"
  /platforms/{platform}/audit-status:
    put:
      tags:
        - Platforms
      operationId: recordPlatformAuditStatus
      summary: Record the audit status of a platform app (administrators only).
      description: |
        Records the status with the date of the decision and its source, and writes an audit entry. An app whose status
        is unknown or unaudited cannot use public visibility.
      security:
        - sessionCookie: []
      parameters:
        - name: platform
          in: path
          required: true
          description: The platform identifier, for example youtube.
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditStatusRequest"
      responses:
        "200":
          description: The recorded audit status with its text and restrictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /channels:
    get:
      tags:
        - Channels
      operationId: listChannels
      summary: List the channels, with their connection state and quota.
      description: |
        Cursor-paged in id order. Read by every signed-in person. The representation carries no token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /channels/connections:
    post:
      tags:
        - Channels
      operationId: startChannelConnection
      summary: Start the connection of a new channel through the platform's consent.
      description: |
        Returns the platform's own consent URL. The browser is sent there; the platform returns it to the callback, and
        the server connects the channel only after the platform grants it. No credential is ever entered in Menura.
        Only a publisher or an administrator may start a connection.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      responses:
        "202":
          description: The consent URL. It carries the state of this flow only and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /channels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Channels
      operationId: getChannel
      summary: One channel with its connection state, scopes, quota and audit status.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Channels
      operationId: disconnectChannel
      summary: Disconnect a channel; the platform grant is revoked where possible and the stored tokens are deleted.
      description: |
        The answer says what the platform did with the grant. When it reports failed, the platform grant may still
        exist and should be revoked in the platform's own settings. The stored tokens are deleted in every case.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The disconnect is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disconnection"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /channels/{id}/consent:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Channels
      operationId: startChannelConsent
      summary: Reconnect a channel that needs reconnection, or enable further features on it, through consent.
      description: |
        The channel keeps its identity, posts and history. A consent for a different platform account is refused and the
        publisher is asked to connect a new channel. Only a publisher or an administrator may start it.
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "202":
          description: The consent URL. It carries the state of this flow only and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /channel-connections/callback:
    get:
      tags:
        - Channels
      operationId: completeChannelConnection
      summary: Callback of the platform consent; sends the browser back to the channel page.
      description: |
        Called by the browser after the platform's consent. The state must belong to a live consent started by the same
        person. The answer is a redirect to the web app's channel page with the outcome; no token is ever placed in it.
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: The state of the consent, as the platform returned it.
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: The authorization code of the platform, exchanged once.
          schema:
            type: string
            maxLength: 2048
        - name: error
          in: query
          required: false
          description: The reason the platform reports when the consent was refused or cancelled.
          schema:
            type: string
            maxLength: 200
      responses:
        "302":
          description: Redirect to the channel page with connection=<outcome>, the channel and a reason when there is one.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content: {}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /brand-kit:
    get:
      tags:
        - Brand
      operationId: getCurrentBrandKit
      summary: The newest version of the brand kit.
      description: |
        Any signed-in role. The first touch of an empty installation seeds version 1 from the stream overlay theme and
        the feather mark. Responses are never cached.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The newest version, with its whole kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitVersion"
        "401":
          $ref: "#/components/responses/Problem"
  /brand-kit/versions:
    post:
      tags:
        - Brand
      operationId: publishBrandKitVersion
      summary: Publishes a draft of the brand kit as the next immutable version.
      description: |
        Editor only. The draft is checked before anything is stored: every colour token has a light and a dark value,
        every text role reaches WCAG AA contrast (4.5:1) in both roles, every typography role has a font file, every
        mark variant has a safe area, every format has one template, every template refers to tokens only and keeps
        badge, title, captions and logo out of the top 14 % and bottom 35 % of the frame, and the short 9:16 follows
        its own slot, timing and join-domain rules. A refusal (422) names every violation and stores nothing. The tonal
        ramps are derived from their seeds at publication; tones sent in the draft are ignored.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKit"
      responses:
        "201":
          description: The published version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitVersion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /brand-kit/versions/{version}:
    get:
      tags:
        - Brand
      operationId: getBrandKitVersion
      summary: One published version, unchanged since its publication.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BrandKitVersionPath"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitVersion"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/render-bundle:
    get:
      tags:
        - Brand
      operationId: getBrandKitRenderBundle
      summary: The JSON render bundle of a version, for external renderers.
      description: |
        The version named by version, else the version the consumer has pinned, else the newest one. The bundle holds
        every colour token with its light and dark values, every typography role with its font file reference, every
        mark with its safe area per variant, the per-language texts and hashtags, and the layout templates.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BrandKitVersionQuery"
        - $ref: "#/components/parameters/ConsumerQuery"
      responses:
        "200":
          description: The render bundle of the resolved version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitVersion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/css:
    get:
      tags:
        - Brand
      operationId: getBrandKitCss
      summary: The colour tokens as CSS custom properties, light and dark.
      description: Each token is exported as --brand-<name> with its light value, and its dark value under the dark scheme.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/BrandKitVersionQuery"
        - $ref: "#/components/parameters/ConsumerQuery"
      responses:
        "200":
          description: A style sheet of custom properties.
          content:
            text/css:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/templates/{format}:
    get:
      tags:
        - Brand
      operationId: getBrandKitTemplate
      summary: The layout template of one format, with its declared parameters.
      description: |
        Formats: short-9x16 (1080 by 1920), long-16x9-intro, long-16x9-outro, thumbnail, social-post-image, end-card and
        overlay-theme. Each template declares its parameters (title, subtitle, image, and join_domain for the short's
        call to action); a renderer rejects an undeclared or missing parameter.
      security:
        - sessionCookie: []
      parameters:
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum:
              - short-9x16
              - long-16x9-intro
              - long-16x9-outro
              - thumbnail
              - social-post-image
              - end-card
              - overlay-theme
        - $ref: "#/components/parameters/BrandKitVersionQuery"
        - $ref: "#/components/parameters/ConsumerQuery"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/texts/{language}:
    get:
      tags:
        - Brand
      operationId: getBrandKitText
      summary: The end-card text and hashtags of one language.
      description: A language without an entry answers 404. No other language is substituted.
      security:
        - sessionCookie: []
      parameters:
        - name: language
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/BrandKitVersionQuery"
        - $ref: "#/components/parameters/ConsumerQuery"
      responses:
        "200":
          description: The text entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageText"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/pins/{consumer}:
    parameters:
      - $ref: "#/components/parameters/ConsumerPath"
    get:
      tags:
        - Brand
      operationId: getBrandKitPin
      summary: The version a consumer has pinned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitPin"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags:
        - Brand
      operationId: setBrandKitPin
      summary: Pins a consumer to an existing version until the pin is changed.
      description: Editor only. A consumer with a pin keeps that version when newer versions are published.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitPinRequest"
      responses:
        "200":
          description: The pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitPin"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Brand
      operationId: removeBrandKitPin
      summary: Removes a pin, so that the consumer follows the newest version again.
      description: Editor only.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The pin is removed.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /brand-kit/events:
    get:
      tags:
        - Brand
      operationId: streamBrandKitEvents
      summary: Server-Sent Events of brand kit publications.
      description: |
        Any signed-in role. Each published version sends one event named brand-kit.published whose data is
        {"version": N} and whose id is N; clients then read the version they need. Only publications made while the
        client is connected are sent, so a client that reconnects reads GET /brand-kit to resynchronise. A heartbeat
        event named heartbeat is sent at least every 25 seconds, so that the stream is not closed as idle.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: An event stream of brand kit notifications.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /channels/{id}/external-posts:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Channels
      operationId: listChannelExternalPosts
      summary: The posts of a channel, imported or published by Menura, with their status and the time of the last sync.
      description: |
        Cursor-paged, newest first. Read by every signed-in person, as the channel is. A removed post carries no link
        (url is null) and status removed; its record and history are kept. A channel that needs reconnection keeps its
        posts and shows channelState needs_reconnection, and no sync reads it until it is connected again.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the channel's posts with the time of its last complete sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPostPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /library/items:
    get:
      tags:
        - Content
      operationId: listPoolItems
      summary: One page of the shared pool, newest first.
      description: |
        The pool holds raw stream recordings (kind raw, stage raw), clips (kind clip, stage cut or rendered, status active
        or suggested) and registered finished assets (kind clip, stage rendered, assetId set). Every person with a Menura
        role sees every item. Filters combine with AND: mine selects the caller's own items, uploader a named member,
        person an item tagged with that person, tag a free tag, stage one stage, and usage applies to every item
        (used when a timeline uses the item or one of its clips, never_used otherwise). Each item names its uploaderId, personTags
        and freeTags.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Mine"
        - $ref: "#/components/parameters/Uploader"
        - $ref: "#/components/parameters/Person"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Stage"
        - $ref: "#/components/parameters/Usage"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: One page of pool items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /library/items/{id}/tags:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      tags:
        - Content
      operationId: setItemTags
      summary: Replace the free and person tags of a raw item or clip.
      description: |
        Only the editor role may change tags. Free tags match ^[a-z0-9-]{2,30}$, at most 20 per item. A person tag that
        names no existing person is refused with 400, and the problem names the field personTags.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagsRequest"
      responses:
        "200":
          description: The tags as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemTags"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /library/clips:
    post:
      tags:
        - Content
      operationId: createClip
      summary: Create a clip inside a raw item.
      description: |
        A clip is a time range of one raw item with a title and free tags. Its stage is cut and its uploader is the
        caller. A range that ends after the recording is refused. Status suggested marks a highlight candidate; it is
        listed as suggested. Only the editor role may create clips.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipRequest"
      responses:
        "201":
          description: The clip as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /library/clips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Content
      operationId: getClip
      summary: One clip.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The clip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags:
        - Content
      operationId: renameClip
      summary: Change the title of a clip; the uploader stays the same.
      description: Only the editor role may change a clip, whoever uploaded it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipTitle"
      responses:
        "200":
          description: The clip as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Content
      operationId: deleteClip
      summary: Delete a clip on an explicit request.
      description: |
        Only the editor role may delete, and every deletion writes one audit entry. A clip that a timeline uses is kept
        so that lineage stays readable; the request is refused with 409.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The clip is deleted.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /library/search:
    get:
      tags:
        - Content
      operationId: searchTranscripts
      summary: Full-text search over transcript segments.
      description: |
        Returns each segment whose text contains every word of q, with its raw item and the second the speech starts at
        (startMillis), so that a client can open the recording at that moment. The filters are those of the pool listing
        and combine with AND; a stage filter keeps only hits from raw items with a clip at that stage. Results are
        ordered by stream date, newest first. Semantic (meaning-based) search is not part of this release.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          description: The words to find. Every word must occur in the segment.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: "#/components/parameters/Mine"
        - $ref: "#/components/parameters/Uploader"
        - $ref: "#/components/parameters/Person"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Stage"
        - $ref: "#/components/parameters/Usage"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The hits, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400":
          $ref: "#/components/responses/Problem"
  /library/raw-items/{id}/transcript:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      tags:
        - Content
      operationId: uploadTranscript
      summary: Attach or replace the transcript of a raw item.
      description: |
        The body is a WebVTT (text/vtt) or SRT (application/x-subrip) file of at most the configured transcript size
        (10 MB by default). It is parsed into timed segments; a malformed cue is refused with a problem that names its
        line. Replacing a transcript replaces all its segments and writes one audit entry. Menura never transcribes:
        the transcript comes from the editing PC.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          text/vtt:
            schema:
              type: string
          application/x-subrip:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: The transcript as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
  /library/raw-items/{id}/media:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    delete:
      tags:
        - Content
      operationId: removeRawMedia
      summary: Remove the recording of a raw item; its row, transcript, clips and lineage stay.
      description: |
        Only the editor role may remove media. The recording is removed from the object storage and the raw item records
        the media state removed; the raw item still lists in the pool and its lineage still names it. A second removal
        is refused with 409. The removal writes one audit entry. Retention moves old recordings to cold storage on its
        own schedule; see the retention CronJob in the Helm chart.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The media is removed.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /library/raw-items/{id}/lineage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Content
      operationId: getRawItemLineage
      summary: The finished assets, timelines and clips made from a raw item.
      description: Exactly the registered finished assets whose timeline uses a clip of this raw item.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The lineage of the raw item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawLineage"
        "404":
          $ref: "#/components/responses/Problem"
  /library/timelines:
    post:
      tags:
        - Content
      operationId: storeTimeline
      summary: Store a timeline as data.
      description: |
        A timeline holds the ordered clips it plays (sourceClipIds), overlays, captions, a layout template reference and
        chapter marks. Chapters must start at 00:00, be in ascending order and be at least ten seconds apart. Only the
        editor role may store timelines; the stored document is returned unchanged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineRequest"
      responses:
        "201":
          description: The timeline as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /library/timelines/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Content
      operationId: getTimeline
      summary: One timeline as stored.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/Problem"
  /library/finished-assets/{id}/registration:
    parameters:
      - name: id
        in: path
        required: true
        description: The identifier of a verified finished video or image.
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Content
      operationId: registerFinishedAsset
      summary: Register a finished asset in the pool, made from a timeline.
      description: |
        Records the lineage (asset to timeline, timeline to clips) and moves the clips of the timeline to stage rendered.
        An asset without a verified upload, or a timeline that does not exist, is rejected with 404 and is not listed.
        A raw recording is refused with 400, and an asset that is registered already with 409.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: The registered asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAsset"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /series:
    get:
      tags:
        - Series
      operationId: listSeries
      summary: Every content series, active and inactive.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The series of the installation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags:
        - Series
      operationId: createSeries
      summary: Stores a new content series. Only the editor role.
      description: |
        The colour and the badge text colour are tokens of the brand kit, never raw values; the badge text must reach 4.5:1
        against the series colour in both roles, and the layout template must exist in the brand kit. A refused series is
        stored nothing.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesRequest"
      responses:
        "201":
          description: The stored series with its identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /series/overview:
    get:
      tags:
        - Series
      operationId: getSeriesOverview
      summary: The series with the audience warning and the weekly coverage of every channel.
      description: |
        Coverage counts published shorts only. A week below 90 percent is flagged; a week without shorts is not flagged.
      security:
        - sessionCookie: []
      parameters:
        - name: weeks
          in: query
          required: false
          description: How many weeks back to report, the current week included. 1 to 52, default 8.
          schema:
            type: integer
            minimum: 1
            maximum: 52
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesOverview"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /series/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The series identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Series
      operationId: getSeries
      summary: One series with its episodes in number order.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The series and its episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags:
        - Series
      operationId: updateSeries
