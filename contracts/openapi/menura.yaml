        - name: limit
          in: query
          required: false
          description: At most this many points, 1 to 1000. Default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsPoints"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /posts:
    post:
      tags:
        - Posts
      operationId: createPost
      summary: Creates a draft post for one finished asset on one channel.
      description: |
        The editor or publisher role creates the draft; the author is recorded. Fields not given are filled from the
        series defaults when a series is named. A recycled post names a source post and must reuse its asset; the source
        is not changed (lineage). Only finished assets recorded by the upload can be planned.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDraftRequest"
      responses:
        "201":
          description: The draft, with status draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags:
        - Posts
      operationId: getPost
      summary: One post with its channel, steps, attempts and dry-run problems.
      description: Read by every signed-in person. A post that does not exist answers 404.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags:
        - Posts
      operationId: updatePost
      summary: Changes the fields of a draft or of a post in review, until it is approved.
      description: |
        Only the fields given change. A post that is approved, scheduled, published or failed refuses the edit with 409;
        its content is changed through a revision instead. A new channel re-derives the playlist from the series.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPatch"
      responses:
        "200":
          description: The changed post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Posts
      operationId: deletePost
      summary: Deletes a draft or a post in review.
      description: A post that was approved, scheduled, published or failed is kept and cannot be deleted.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The post was deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /posts/{id}/submission:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags:
        - Posts
      operationId: submitPost
      summary: Sends a draft to review (status in_review).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The post in review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /posts/{id}/approval:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags:
        - Posts
      operationId: approvePost
      summary: A publisher approves a post in review (status approved).
      description: |
        Requires the publisher role and the web application's own session. A token, a desktop app or an MCP client is
        refused with 403 whatever role it holds: approval is a human decision in the web application.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The approved post, with the publisher recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /posts/{id}/schedule:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags:
        - Posts
      operationId: schedulePost
      summary: Schedules an approved post, or a failed post that is to be published again (status scheduled).
      description: |
        The publisher role is required. The schedule dry run runs now: a blocking problem (text or hashtag limits, format,
        a connection that needs reconnection, an unaudited public visibility) refuses the schedule with 422 and lists the
        problems. A collision with another post on the channel is a warning: it is shown and does not block. The
        publication job publishes the post at its time, or hands it to the platform when the platform schedules natively.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The scheduled post with its dry-run problems.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /post-plans:
    post:
      tags:
        - Posts
      operationId: planPosts
      summary: Plans one finished asset onto several channels, one post per channel with its own text and time.
      description: |
        Each channel is checked on its own. A channel that does not exist, is not connected or whose platform is not
        supported in this build is refused and named with its reason; the other posts are stored.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPlanRequest"
      responses:
        "201":
          description: The drafts created and the channels refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPlanResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /series/{id}/episodes:
    parameters:
      - name: id
        in: path
        required: true
        description: The series identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Posts
      operationId: planSeriesEpisodes
      summary: Plans the next episodes of a series onto the free weekday and posting slots of one channel.
      description: |
        Each episode takes the next free slot of the series' weekday and posting hour in the installation time zone. A slot
        that already holds a post on the channel is skipped and named in the result. Each draft takes the series title,
        opening formula, hashtag and the channel's playlist; the editor may change each value until approval.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodePlanRequest"
      responses:
        "201":
          description: The drafts created and the slots skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePlanResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /posts/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags:
        - Posts
      operationId: listPostRevisions
      summary: The revisions proposed for a post, with their status and rationale.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The revisions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags:
        - Posts
      operationId: proposePostRevision
      summary: Proposes a revision of a post with a rationale. The post itself does not change.
      description: |
        Allowed for a draft, a post in review, an approved post and a scheduled post. A revision stores only the fields it
        names; a null field is unchanged. A post already handed to its platform takes no revision.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "201":
          description: The pending revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostRevision"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /posts/{id}/revisions/{revisionId}/acceptance:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags:
        - Posts
      operationId: acceptPostRevision
      summary: A publisher accepts a pending revision in the web application; the post changes.
      description: |
        An approved, scheduled or failed post returns to review, so its approval happens again. Requires the publisher role
        and the web application's session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The changed post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /posts/{id}/revisions/{revisionId}/rejection:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags:
        - Posts
      operationId: rejectPostRevision
      summary: A publisher rejects a pending revision; the post stays unchanged.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The rejected revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostRevision"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /calendar:
    get:
      tags:
        - Calendar
      operationId: readCalendar
      summary: Planned and published posts of a month, a week or a list of days, with filters.
      description: |
        Planned and published posts appear together. Every time is in the installation time zone (default Europe/Berlin):
        each item carries its local date and time next to the UTC instant. The range is bounded: a list covers at most 92
        days, and one read returns at most 1000 items (truncated tells when more exist). Each item carries its steps and
        its dry-run problems, computed on read.
      security:
        - sessionCookie: []
      parameters:
        - name: view
          in: query
          required: false
          description: Which view to return. Defaults to month.
          schema:
            type: string
            enum:
              - month
              - week
              - list
        - name: date
          in: query
          required: false
          description: A day in the view, as YYYY-MM-DD in the installation time zone. Defaults to today there.
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          description: Days a list covers, from the date, at most 92. Defaults to 31; ignored by month and week.
          schema:
            type: integer
            minimum: 1
            maximum: 92
        - $ref: "#/components/parameters/CalendarChannel"
        - $ref: "#/components/parameters/CalendarSeries"
        - $ref: "#/components/parameters/CalendarStatus"
      responses:
        "200":
          description: The calendar window with its items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"


  /join-events:
    post:
      tags:
        - Attribution
      operationId: recordJoinEvent
      summary: Records a join of a player, as the network proxy reports it.
      description: |
        Called by the network proxy only, with its own credential as a bearer secret; a signed-in person answers 403. The
        body holds the proxy's event id, the first-join flag, the time of the join and a pseudonym that the proxy computes
        with a keyed hash. Any other field, and any value that carries a player UUID, a name or an IP address, is refused
        with 422 and nothing is stored. A repeated event id with the same content answers 200 and counts nothing new.
      security:
        - joinProxyCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinEventRequest"
      responses:
        "200":
          description: The event was stored already with the same content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinEventReceipt"
        "201":
          description: The event was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinEventReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /join-events/{eventId}/source-answer:
    parameters:
      - $ref: "#/components/parameters/JoinEventId"
    post:
      tags:
        - Attribution
      operationId: recordJoinSourceAnswer
      summary: Records where a player says they found the network, for one first join.
      description: |
        Called by the network proxy only. Accepted once per first join and up to 24 hours after the join; a repeated answer
        with the same source answers 200, a different one 409. The body holds exactly one of the fixed choices; free text
        is refused with 422.
      security:
        - joinProxyCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSourceAnswerRequest"
      responses:
        "200":
          description: The same answer was stored already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSourceAnswerReceipt"
        "201":
          description: The answer was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSourceAnswerReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /join-attribution/settings:
    get:
      tags:
        - Attribution
      operationId: getJoinSettings
      summary: The join domain and the attribution window of the installation.
      description: Readable by the admin role only.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      tags:
        - Attribution
      operationId: putJoinSettings
      summary: Sets the join domain and, optionally, the attribution window of the installation.
      description: |
        Only the admin role sets them. The domain must be one lower-case host name; the window is a whole number of hours
        from 1 to 720 and keeps its value when it is not sent.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSettingsRequest"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /join-attribution/new-players:
    get:
      tags:
        - Attribution
      operationId: getNewPlayers
      summary: New players per day or ISO week, with the stated sources, the unanswered joins and the answer rate.
      description: |
        Every figure per stated source is labelled "stated by players" and sits next to the answer rate of its period.
        Unanswered joins are the total minus the stated sources. No figure is labelled as measured by a platform.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JoinFrom"
        - $ref: "#/components/parameters/JoinTo"
        - $ref: "#/components/parameters/JoinGrouping"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinNewPlayers"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /join-attribution/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The external post identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Attribution
      operationId: getJoinPostEstimate
      summary: The estimated first joins that followed one post within the attribution window.
      description: An estimate, labelled as such. A post the caller may not see answers 404.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinPostEstimate"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /join-attribution/series:
    get:
      tags:
        - Attribution
      operationId: getJoinSeriesEstimates
      summary: The estimated first joins per series for the joins of a period.
      description: |
        Estimates, labelled as such. Posts without a series are summed under "no series", which comes last. Posts of series the
        caller may not see are left out.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JoinFrom"
        - $ref: "#/components/parameters/JoinTo"
      responses:
        "200":
          description: The estimates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSeriesEstimates"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /posts/{id}/youtube-declaration:
    parameters:
      - $ref: "#/components/parameters/PostId"
    put:
      tags:
        - Posts
      operationId: declarePostMadeForKids
      summary: Declares whether a YouTube post is made for kids (required before a YouTube post can be scheduled).
      description: |
        The editor or publisher role is required, and the post must still be editable. Menura never relies on the platform
        default: a YouTube post is refused for scheduling until this declaration is given. The visibility is declared by
        setting it on the post (PATCH or creation).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YouTubeMadeForKids"
      responses:
        "200":
          description: The post with the declaration applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-menura-session
      description: The web session cookie set by the sign-in. Its value is an opaque secret, never a token.
    joinProxyCredential:
      type: http
      scheme: bearer
      description: The network proxy's own credential, sent as a bearer secret. Only its SHA-256 digest is configured in the server.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items per page. Values above 200 are reduced to 200.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from nextCursor of the previous page. Omit it for the first page.
      required: false
      schema:
        type: string
    BrandKitVersionPath:
      name: version
      in: path
      required: true
      description: The number of a published brand kit version, starting at 1.
      schema:
        type: integer
        minimum: 1
    BrandKitVersionQuery:
      name: version
      in: query
      required: false
      description: A brand kit version number. Takes precedence over consumer.
      schema:
        type: integer
        minimum: 1
    ConsumerPath:
      name: consumer
      in: path
      required: true
      description: The name of a consumer, such as overlay-scene or obs-plugin. Lower case letters, digits and hyphens.
      schema:
        $ref: "#/components/schemas/ConsumerName"
    ConsumerQuery:
      name: consumer
      in: query
      required: false
      description: |
        A consumer whose pinned version is read. A consumer without a pin reads the newest version. Ignored when version
        is given.
      schema:
        $ref: "#/components/schemas/ConsumerName"
    Mine:
      name: mine
      in: query
      description: Only the items the caller uploaded.
      required: false
      schema:
        type: boolean
    Uploader:
      name: uploader
      in: query
      description: Only the items of this member (a person identifier).
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    Person:
      name: person
      in: query
      description: Only the items that carry this person tag (a person identifier).
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    Tag:
      name: tag
      in: query
      description: Only the items that carry this free tag.
      required: false
      schema:
        type: string
        pattern: "^[a-z0-9-]{2,30}$"
    Stage:
      name: stage
      in: query
      description: Only the items at this stage.
      required: false
      schema:
        type: string
        enum:
          - raw
          - cut
          - rendered
    Usage:
      name: usage
      in: query
      description: used when a timeline uses the item or one of its clips, never_used otherwise. Finished assets are never used in phase 1.
      required: false
      schema:
        type: string
        enum:
          - used
          - never_used
    From:
      name: from
      in: query
      description: Only the items created on or after this UTC date.
      required: false
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: Only the items created on or before this UTC date.
      required: false
      schema:
        type: string
        format: date
    AnalyticsFrom:
      name: from
      in: query
      required: false
      description: First publication day in Europe/Berlin, inclusive. Default 89 days before to.
      schema:
        type: string
        format: date
    AnalyticsTo:
      name: to
      in: query
      required: false
      description: Last publication day in Europe/Berlin, inclusive. Default today. At most 800 days after from.
      schema:
        type: string
        format: date
    AnalyticsPostId:
      name: id
      in: path
      required: true
      description: The external post.
      schema:
        $ref: "#/components/schemas/Identifier"
    PostId:
      name: id
      in: path
      required: true
      description: The post identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: The revision identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    CalendarChannel:
      name: channelId
      in: query
      required: false
      description: Only the posts of this channel.
      schema:
        $ref: "#/components/schemas/Identifier"
    CalendarSeries:
      name: seriesId
      in: query
      required: false
      description: Only the posts of this series.
      schema:
        $ref: "#/components/schemas/Identifier"
    CalendarStatus:
      name: status
      in: query
      required: false
      description: Only the posts in this status.
      schema:
        $ref: "#/components/schemas/PostStatus"

    JoinEventId:
      name: eventId
      in: path
      required: true
      description: The event id the network proxy assigned to the join.
      schema:
        $ref: "#/components/schemas/Identifier"
    JoinFrom:
      name: from
      in: query
      required: false
      description: First day in the installation's time zone, inclusive. Default 29 days before to.
      schema:
        type: string
        format: date
    JoinTo:
      name: to
      in: query
      required: false
      description: Last day in the installation's time zone, inclusive. Default today.
      schema:
        type: string
        format: date
    JoinGrouping:
      name: grouping
      in: query
      required: false
      description: Whether a period is a calendar day or an ISO week (Monday to Sunday).
      schema:
        type: string
        enum:
          - day
          - week
        default: day

  responses:
    Problem:
      description: An error, described by RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Every error response carries these five members.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the problem type; about:blank when no specific type applies.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code of the response.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence. It never contains internal details.
        instance:
          type: string
          description: The path of the request that failed.
    CursorPage:
      type: object
      description: Envelope of every cursor-paged list. nextCursor is null on the last page.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - "null"
    Identifier:
      type: string
      format: uuid
      description: A random RFC 9562 version 4 UUID. Identifiers carry no creation time and no sequence.
      example: 4f0c7a52-9d1e-4b8a-8e3f-2a6c5d7b9e10
    IssuedCalendarFeedToken:
      type: object
      description: A calendar feed token, shown once. The server keeps only its hash.
      required:
        - token
      properties:
        token:
          type: string
          description: The token as "<identifier>.<secret>"; the secret is 256 random bits.
    HealthStatus:
      type: object
      description: Overall status and database readiness. Nothing else is revealed.
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        database:
          type: string
          enum:
            - UP
            - DOWN
    SessionView:
      type: object
      description: The signed-in person. Carries no token; roles are the Menura roles the person holds.
      required:
        - subject
        - roles
      properties:
        subject:
          type: string
          description: The stable subject of the person, as issued by the authorization server.
        roles:
          type: array
          items:
            type: string
            enum:
              - VIEWER
              - EDITOR
              - PUBLISHER
              - OPERATOR
              - ADMIN
    AssetUploadRequest:
      type: object
      description: What an editor declares to start an upload. Every field is checked; a missing one is named in the problem.
      required:
        - kind
        - format
        - sizeBytes
        - checksum
        - width
        - height
      properties:
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
          description: The container or image format, in lower case (mp4, mov, webm, mkv, png, jpg, jpeg, webp or gif).
          maxLength: 16
        durationSeconds:
          type: integer
          minimum: 1
          description: Required for video and raw_material; not allowed for image. Declared by the client, never probed.
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        checksum:
          type: string
          description: The SHA-256 of the part digests, base64, then a dash and the part count, as in "base64=-3". The server compares it with the storage's own value on completion.
          pattern: "^[A-Za-z0-9+/]{43}=-[1-9][0-9]{0,4}$"
        streamTitle:
          type: string
          maxLength: 200
          description: Required for raw_material. No control or format characters.
        streamDate:
          type: string
          format: date
          description: Required for raw_material; the day of the stream.
    PartUrl:
      type: object
      description: A presigned PUT URL for one part. The browser sends the part with its x-amz-checksum-sha256 header.
      required:
        - partNumber
        - sizeBytes
        - url
        - expiresAt
      properties:
        partNumber:
          type: integer
          minimum: 1
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    UploadSessionView:
      type: object
      description: An upload session. Nullable members are always present, as null when they do not apply.
      required:
        - id
        - state
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - partSizeBytes
        - partCount
        - confirmedParts
        - parts
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            - flagged
            - uploading
            - available
            - failed
            - cancelled
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        partSizeBytes:
          type: integer
          format: int64
        partCount:
          type: integer
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        duplicateOf:
          type:
            - string
            - "null"
          format: uuid
          description: The asset the checksum already belongs to, when the upload is flagged.
        assetId:
          type:
            - string
            - "null"
          format: uuid
        failureReason:
          type:
            - string
            - "null"
          description: Why the session failed, for example checksum_mismatch.
        confirmedParts:
          type: array
          items:
            type: integer
            minimum: 1
          description: The part numbers the storage has confirmed, ascending.
        nextPart:
          type:
            - integer
            - "null"
          description: The first part not yet confirmed; null when every part is confirmed.
        parts:
          type: array
          description: Presigned URLs for the parts not yet confirmed, ascending.
          items:
            $ref: "#/components/schemas/PartUrl"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetView:
      type: object
      description: A verified asset as listed. Metadata only; links are requested separately.
      required:
        - id
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - uploaderId
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        createdAt:
          type: string
          format: date-time
    AssetPage:
      description: One cursor page of assets; the envelope is CursorPage.
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AssetView"
    SignedLink:
      type: object
      description: A signed link to one object. The storage refuses it after expiresAt.
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ChannelPage:
      type: object
      description: One page of channels. nextCursor is null on the last page.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        nextCursor:
          type:
            - string
            - "null"
    Channel:
      type: object
      description: >-
        A channel of a platform account. It has no field for a token, a secret or a token fragment; its scopes and
        expiry are separate fields.
      required:
        - id
        - platform
        - displayName
        - platformAccountId
        - state
        - features
        - grantedScopes
        - missingScopes
        - createdAt
        - updatedAt
        - quota
        - audit
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        platform:
          type: string
          description: The platform identifier, for example youtube.
        displayName:
          type: string
        platformAccountId:
          type: string
          description: The identifier of the channel at the platform.
        state:
          type: string
          enum:
            - connected
            - needs_reconnection
            - disconnected
        stateReason:
          type:
            - string
            - "null"
          description: Why the channel needs reconnection, in readable words.
        features:
          type: array
          description: The features the channel is enabled for.
          items:
            type: string
        grantedScopes:
          type: array
          description: The scopes the platform granted.
          items:
            type: string
        missingScopes:
          type: array
          description: Scopes an enabled feature needs that were not granted. Flagged, not refused.
          items:
            type: string
        grantRevocation:
          type:
            - string
            - "null"
          enum:
            - revoked
            - not_supported
            - failed
            - null
          description: What the platform did with the grant at disconnect. failed means the grant may still exist.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        quota:
          $ref: "#/components/schemas/QuotaView"
        audit:
          $ref: "#/components/schemas/AuditView"
    QuotaView:
      type: object
      description: Quota and rate-limit state of a channel, as reported or measured. Null values were never reported.
      required:
        - warning
      properties:
        used:
          type:
            - integer
            - "null"
        limit:
          type:
            - integer
            - "null"
        resetAt:
          type:
            - string
            - "null"
          format: date-time
        warning:
          type: boolean
          description: True when the used share is above the configured warning level.
        delay:
          oneOf:
            - $ref: "#/components/schemas/DelayView"
            - type: "null"
    DelayView:
      type: object
      description: A platform rate limit that delays publications until nextAttemptAt.
      required:
        - reason
        - nextAttemptAt
      properties:
        reason:
          type: string
        nextAttemptAt:
          type: string
          format: date-time
    AuditView:
      type: object
      description: The audit status of a platform app, its readable text and the restrictions it implies.
      required:
        - status
        - displayText
        - restrictions
      properties:
        status:
          type: string
          enum:
            - unknown
            - unaudited
            - audited
        displayText:
          type: string
          example: "unaudited: uploads private only"
        restrictions:
          type: array
          items:
            type: string
          example:
            - public visibility not available
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
        source:
          type:
            - string
            - "null"
    Platform:
      type: object
      description: A platform of this build with what it supports and the features a channel can enable.
      required:
        - platform
        - displayName
        - capabilities
        - features
        - audit
      properties:
        platform:
          type: string
        displayName:
          type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        audit:
          $ref: "#/components/schemas/AuditView"
    Capabilities:
      type: object
      description: What the platform offers and what this build supports.
      required:
        - publishing
        - nativeScheduling
        - listing
        - metrics
        - revocation
      properties:
        publishing:
          type: boolean
        nativeScheduling:
          type: boolean
        listing:
          type: boolean
        metrics:
          type: boolean
        revocation:
          type: boolean
    Feature:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    Authorization:
      type: object
      description: The platform's consent URL. It carries the state of this flow only.
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
    ConnectRequest:
      type: object
      description: A new connection. Features are optional and must be declared by the platform.
      required:
        - platform
      properties:
        platform:
          type: string
          maxLength: 40
          pattern: "^[a-z][a-z0-9_-]{0,39}$"
        features:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,39}$"
    ConsentRequest:
      type: object
      description: Features to enable on a reconnection. Omitting them keeps the channel's features.
      properties:
        features:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,39}$"
    Disconnection:
      type: object
      description: The outcome of a disconnect at the platform.
      required:
        - revocation
      properties:
        revocation:
          type: string
          enum:
            - revoked
            - not_supported
            - failed
    AuditStatusRequest:
      type: object
      description: The audit status of a platform app and its source.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - unknown
            - unaudited
            - audited
        source:
          type: string
          maxLength: 200
          description: Where the decision came from, for example the audit letter or the console review.
    ConsumerName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,63}$"
      description: The name of a consumer of the brand kit.
    BrandKitVersion:
      type: object
      description: One published version of the brand kit. The kit of a version never changes after its publication.
      required:
        - version
        - publishedBy
        - createdAt
        - kit
      properties:
        version:
          type: integer
          minimum: 1
        publishedBy:
          $ref: "#/components/schemas/Identifier"
        createdAt:
          type: string
          format: date-time
        kit:
          $ref: "#/components/schemas/BrandKit"
    BrandKit:
      type: object
      description: >-
        The whole kit of one version. Colours are named tokens with a light and a dark value; the tonal ramps are derived
        from their seeds at publication; text roles name a colour token and the background token it is shown on; templates
        refer to tokens only, never to raw colours.
      required:
        - colours
        - ramps
        - textRoles
        - typography
        - marks
        - voice
        - texts
        - templates
      properties:
        colours:
          type: array
          items:
            $ref: "#/components/schemas/ColourToken"
        ramps:
          type: array
          items:
            $ref: "#/components/schemas/TonalRamp"
        textRoles:
          type: array
          items:
            $ref: "#/components/schemas/TextRole"
        typography:
          type: array
          items:
            $ref: "#/components/schemas/TypographyRole"
        marks:
          type: array
          items:
            $ref: "#/components/schemas/Mark"
        voice:
          type: string
          description: The voice and tone rules as text.
        texts:
          type: array
          description: Hashtags and end-card text per language. A language without an entry has no text.
          items:
            $ref: "#/components/schemas/LanguageText"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/Template"
    ColourToken:
      type: object
      description: A named colour with its value for the light role and its value for the dark role.
      required:
        - name
        - light
        - dark
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
        light:
          $ref: "#/components/schemas/HexColour"
        dark:
          $ref: "#/components/schemas/HexColour"
    HexColour:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      description: A colour in the form #rrggbb.
    TonalRamp:
      type: object
      description: A seed colour and its tones. The tones are computed by the server at publication.
      required:
        - name
        - seed
        - tones
      properties:
        name:
          type: string
        seed:
          $ref: "#/components/schemas/HexColour"
        tones:
          type: array
          items:
            $ref: "#/components/schemas/Tone"
    Tone:
      type: object
      required:
        - tone
        - hex
      properties:
        tone:
          type: integer
          minimum: 0
          maximum: 100
        hex:
          $ref: "#/components/schemas/HexColour"
    TextRole:
      type: object
      description: A text colour token shown on a background token. Both roles must reach WCAG AA contrast.
      required:
        - name
        - colour
        - background
      properties:
        name:
          type: string
        colour:
          type: string
          description: The name of a colour token.
        background:
          type: string
          description: The name of a colour token.
    TypographyRole:
      type: object
      description: >-
        One role, such as headline, body or caption, with its font and its set of sizes. The font is a verified asset of
        the library, referenced by its id; the file is never sent with the kit. A role without a font asset is refused.
      required:
        - role
        - fontAsset
        - sizesPx
      properties:
        role:
          type: string
        fontAsset:
          $ref: "#/components/schemas/Identifier"
        sizesPx:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
    Mark:
      type: object
      description: A logo or mark with named variants.
      required:
        - name
        - variants
      properties:
        name:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/MarkVariant"
    MarkVariant:
      type: object
      description: >-
        One variant of a mark: the verified library asset that holds its file, referenced by id, and the safe area no
        other element may enter.
      required:
        - name
        - asset
        - safeArea
      properties:
        name:
          type: string
        asset:
          $ref: "#/components/schemas/Identifier"
        safeArea:
          $ref: "#/components/schemas/SafeArea"
    SafeArea:
      type: object
      description: The margin of a safe area, in percent of the frame, per side.
      required:
        - top
        - right
        - bottom
        - left
      properties:
        top:
          type: number
          minimum: 0
          maximum: 100
        right:
          type: number
          minimum: 0
          maximum: 100
        bottom:
          type: number
          minimum: 0
          maximum: 100
        left:
          type: number
          minimum: 0
          maximum: 100
    LanguageText:
      type: object
      description: The end-card text and hashtags of one language.
      required:
        - language
        - endCard
        - hashtags
      properties:
        language:
          type: string
        endCard:
          type: string
        hashtags:
          type: array
          items:
            type: string
    Template:
      type: object
      description: >-
        A layout template of one format. It is declarative: elements, token references, timing, safe-zone placement and
        declared parameters. The short 9:16 (1080 by 1920) declares the slots badge (whole duration), title (0 to 3 s),
        captions, session-tiles and cta (last 2 s, with the text parameter join_domain), and no end card. Boxes are in
        percent of the frame from the top left corner. Badge, title, captions and logo lie between 14 % and 65 % of the
        frame height.
      required:
        - format
        - name
        - width
        - height
        - slots
        - parameters
      properties:
        format:
          type: string
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
    Slot:
      type: object
      description: One element of a template. A colour and a background are token names, never raw values.
      required:
        - name
        - kind
        - x
        - y
        - width
        - height
        - timing
      properties:
        name:
          type: string
        kind:
          type: string
        colour:
          type: string
          description: The name of a colour token.
        background:
          type: string
          description: The name of a colour token.
        parameter:
          type: string
          description: The declared parameter that fills this slot.
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        timing:
          $ref: "#/components/schemas/Timing"
    Timing:
      type: object
      description: >-
        When a slot is shown, in seconds. With fromEnd the values count back from the end of the output. An until of
        null lasts to the end.
      required:
        - from
        - fromEnd
      properties:
        from:
          type: number
          minimum: 0
        until:
          type: [number, "null"]
          minimum: 0
        fromEnd:
          type: boolean
    Parameter:
      type: object
      description: A parameter a person fills in. Undeclared parameters are refused.
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - text
            - image
        required:
          type: boolean
    KitPin:
      type: object
      description: The version a consumer has pinned.
      required:
        - consumer
        - version
        - updatedAt
      properties:
        consumer:
          $ref: "#/components/schemas/ConsumerName"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    KitPinRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    ExternalPostPage:
      type: object
      description: One page of a channel's external posts, with the time of its last complete sync.
      required:
        - channelId
        - channelState
        - items
        - nextCursor
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        channelState:
          type: string
          enum:
            - connected
            - needs_reconnection
            - disconnected
        lastSuccessfulSyncAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the channel was last re-synced completely. Null when it never was.
        lastFailedSyncAt:
          type:
            - string
            - "null"
          format: date-time
        syncFailureReason:
          type:
            - string
            - "null"
          description: The fixed text of the last failed sync, with no token and no response body.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalPost"
        nextCursor:
          type:
            - string
            - "null"
    ExternalPost:
      type: object
      description: >-
        A post or video of a channel. It holds metadata and the platform URL only; no media is stored by Menura.
      required:
        - id
        - platform
        - title
        - format
        - publishedAt
        - url
        - status
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        platform:
          type: string
        title:
          type: string
        format:
          type: string
        publishedAt:
          type: string
          format: date-time
          description: The publish time in UTC.
        url:
          type:
            - string
            - "null"
          description: The platform link. Null when the post is removed.
        status:
          type: string
          enum:
            - live
            - removed
        removedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the removal was seen. Null while the post is live.
    PoolItem:
      type: object
      description: One item of the shared pool. kind raw is a stream recording; kind clip is a clip or a registered finished asset.
      required:
        - id
        - kind
        - stage
        - status
        - uploaderId
        - personTags
        - freeTags
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum:
            - raw
            - clip
        stage:
          type: string
          enum:
            - raw
            - cut
            - rendered
        status:
          type: string
          enum:
            - active
            - suggested
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        title:
          type:
            - string
            - "null"
          description: The stream title of a raw item, or the title of a clip or registered asset.
        rawItemId:
          type:
            - string
            - "null"
          format: uuid
          description: The raw item a clip is cut from; null for raw items and registered assets.
        assetId:
          type:
            - string
            - "null"
          format: uuid
          description: The finished asset of a registered item; null otherwise.
        startSeconds:
          type:
            - integer
            - "null"
        endSeconds:
          type:
            - integer
            - "null"
        usage:
          type:
            - string
            - "null"
          enum:
            - used
            - never_used
            - null
          description: Set for every item. used when a timeline uses the item or one of its clips; finished assets are never used.
        personTags:
          type: array
          description: The hub people who appear in the item.
          items:
            $ref: "#/components/schemas/Identifier"
        freeTags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    PoolPage:
      description: One cursor page of pool items; the envelope is CursorPage.
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PoolItem"
    TagsRequest:
      type: object
      description: The complete tag sets of an item; they replace the current ones.
      properties:
        freeTags:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: "^[a-z0-9-]{2,30}$"
        personTags:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
    ItemTags:
      type: object
      required:
        - itemId
        - freeTags
        - personTags
      properties:
        itemId:
          $ref: "#/components/schemas/Identifier"
        freeTags:
          type: array
          items:
            type: string
        personTags:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
    ClipRequest:
      type: object
      required:
        - rawItemId
        - startSeconds
        - endSeconds
        - title
      properties:
        rawItemId:
          $ref: "#/components/schemas/Identifier"
        startSeconds:
          type: integer
          minimum: 0
        endSeconds:
          type: integer
          minimum: 1
          description: Must be after startSeconds and within the recording's duration.
        title:
          type: string
          minLength: 1
          maxLength: 200
        freeTags:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: "^[a-z0-9-]{2,30}$"
        status:
          type: string
          enum:
            - active
            - suggested
          default: active
    ClipTitle:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    Clip:
      type: object
      description: A clip. Its uploader is set at creation and never changes; stage is cut until a finished asset is registered from it.
      required:
        - id
        - rawItemId
        - uploaderId
        - title
        - startSeconds
        - endSeconds
        - status
        - stage
        - freeTags
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        rawItemId:
          $ref: "#/components/schemas/Identifier"
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
        startSeconds:
          type: integer
        endSeconds:
          type: integer
        status:
          type: string
          enum:
            - active
            - suggested
        stage:
          type: string
          enum:
            - cut
            - rendered
        freeTags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    SearchHit:
      type: object
      description: A transcript segment that matched, with the raw item and the position of its speech in that recording.
      required:
        - rawItemId
        - title
        - uploaderId
        - startMillis
        - endMillis
        - text
      properties:
        rawItemId:
          $ref: "#/components/schemas/Identifier"
        title:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        startMillis:
          type: integer
          format: int64
          description: The milliseconds into the recording at which the speech starts; open the raw item here.
        endMillis:
          type: integer
          format: int64
        speaker:
          type:
            - string
            - "null"
          description: Set only for segments of a JSON transcript that names a speaker.
        text:
          type: string
    Transcript:
      type: object
      required:
        - rawItemId
        - format
        - segmentCount
        - replaced
        - uploadedAt
      properties:
        rawItemId:
          $ref: "#/components/schemas/Identifier"
        format:
          type: string
          enum:
            - webvtt
            - srt
        segmentCount:
          type: integer
        replaced:
          type: boolean
          description: True when an earlier transcript of the raw item was replaced.
        uploadedAt:
          type: string
          format: date-time
    Chapter:
      type: object
      required:
        - seconds
        - title
      properties:
        seconds:
          type: integer
          minimum: 0
          description: Where the chapter starts; the first chapter is at 0.
        title:
          type: string
          minLength: 1
          maxLength: 100
    TimelineDocument:
      type: object
      description: The timeline as data. Source ranges are clips of the pool, in play order.
      required:
        - sourceClipIds
      properties:
        layoutTemplate:
          type:
            - string
            - "null"
          description: Reference to a layout template of the brand kit.
        sourceClipIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Identifier"
        overlays:
          type: array
          items:
            type: object
        captions:
          type: array
          items:
            type: object
        chapters:
          type: array
          description: Chapter marks, ascending, the first at 0, at least ten seconds apart.
          items:
            $ref: "#/components/schemas/Chapter"
    TimelineRequest:
      type: object
      required:
        - title
        - document
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        document:
          $ref: "#/components/schemas/TimelineDocument"
    Timeline:
      type: object
      required:
        - id
        - title
        - uploaderId
        - document
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        document:
          $ref: "#/components/schemas/TimelineDocument"
        createdAt:
          type: string
          format: date-time
    Registration:
      type: object
      required:
        - timelineId
        - title
      properties:
        timelineId:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
          minLength: 1
          maxLength: 200
    RegisteredAsset:
      type: object
      required:
        - assetId
        - title
        - uploaderId
        - timelineId
        - registeredAt
      properties:
        assetId:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        timelineId:
          $ref: "#/components/schemas/Identifier"
        registeredAt:
          type: string
          format: date-time
    RawLineage:
      type: object
      description: The finished assets made from a raw item. Each names its timeline and the clips of this raw item it uses.
      required:
        - rawItemId
        - assets
      properties:
        rawItemId:
          $ref: "#/components/schemas/Identifier"
        assets:
          type: array
          items:
            type: object
            required:
              - assetId
              - title
              - timelineId
              - clipIds
            properties:
              assetId:
                $ref: "#/components/schemas/Identifier"
              title:
                type: string
              timelineId:
                $ref: "#/components/schemas/Identifier"
              clipIds:
                type: array
                items:
                  $ref: "#/components/schemas/Identifier"
    SeriesRequest:
      type: object
      description: A content series as an editor sends it. Colours are brand-kit token names, never hex values.
      required:
        - name
        - badgeText
        - colourToken
        - badgeToken
        - openingFormula
        - layoutTemplate
        - hashtag
        - audience
        - weekday
        - postingSlot
      properties:
        name:
          type: string
          maxLength: 80
        badgeText:
          type: object
          description: The badge text per language, for example de. At least one language.
          additionalProperties:
            type: string
            maxLength: 40
        colourToken:
          type: string
          description: The brand-kit token of the series colour.
        badgeToken:
          type: string
          description: The brand-kit token of the badge text colour; must reach 4.5:1 against the series colour.
        openingFormula:
          type: string
          maxLength: 120
        layoutTemplate:
          type: string
          description: The format of a layout template of the brand kit, for example short-9x16.
        hashtag:
          type: string
          description: Starts with #, two to 49 letters, digits or underscores. Stored in lower case.
        audience:
          type: string
          enum:
            - players
            - developers
            - mixed
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: The preferred weekday, 1 (Monday) to 7 (Sunday).
        postingSlot:
          type: integer
          enum:
            - 12
            - 18
            - 21
          description: The preferred posting hour. A hint for planning; comparisons use a random slot.
        active:
          type: boolean
          description: Defaults to true.
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPlaylist"
        visibleTo:
          type: array
          description: The roles that may see the series. Omitted means every role. A series a caller may not see answers 404.
          minItems: 1
          items:
            type: string
            enum:
              - viewer
              - editor
              - publisher
              - operator
              - admin
    SeriesPlaylist:
      type: object
      required:
        - channelId
        - playlistId
        - playlistName
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        playlistId:
          type: string
        playlistName:
          type: string
    Series:
      type: object
      description: A content series with its opaque identifier and its checked values.
      required:
        - id
        - name
        - badgeText
        - colourToken
        - badgeToken
        - openingFormula
        - layoutTemplate
        - hashtag
        - audience
        - weekday
        - postingSlot
        - active
        - playlists
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        badgeText:
          type: object
          additionalProperties:
            type: string
        colourToken:
          type: string
        badgeToken:
          type: string
        openingFormula:
          type: string
        layoutTemplate:
          type: string
        hashtag:
          type: string
        audience:
          type: string
          enum:
            - players
            - developers
            - mixed
        weekday:
          type: integer
        postingSlot:
          type: integer
        active:
          type: boolean
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPlaylist"
        visibleTo:
          type: array
          description: The roles that may see the series.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SeriesDetail:
      type: object
      required:
        - series
        - episodes
      properties:
        series:
          $ref: "#/components/schemas/Series"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
    Episode:
      type: object
      description: One episode of a series. The number is never reused within the series.
      required:
        - number
        - postId
        - title
        - format
        - publishedAt
      properties:
        number:
          type: integer
        postId:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
        format:
          type: string
        publishedAt:
          type: string
          format: date-time
        playlistState:
          type:
            - string
            - "null"
          enum:
            - in_playlist
            - missing
            - not_checked
            - null
    SeriesAssignRequest:
      type: object
      description: Names one series, or the no-series mark. Exactly one of the two.
      required:
        - noSeries
        - replace
      properties:
        seriesId:
          $ref: "#/components/schemas/Identifier"
        noSeries:
          type: boolean
        replace:
          type: boolean
          description: Set to true to move a post that already has a decision.
    SeriesAssignment:
      type: object
      required:
        - postId
        - noSeries
      properties:
        postId:
          $ref: "#/components/schemas/Identifier"
        seriesId:
          type:
            - string
            - "null"
        noSeries:
          type: boolean
        flag:
          type:
            - string
            - "null"
          enum:
            - two_series
            - null
        playlistState:
          type:
            - string
            - "null"
          enum:
            - in_playlist
            - missing
            - not_checked
            - null
        playlistCheckedAt:
          type:
            - string
            - "null"
          format: date-time
        assignedAt:
          type: string
          format: date-time
        assignedBy:
          type:
            - string
            - "null"
    SeriesOverview:
      type: object
      required:
        - series
        - warnings
        - coverage
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
        warnings:
          type: array
          description: Warning codes. no_players_series means no active series targets the audience players.
          items:
            type: string
        coverage:
          type: array
          items:
            $ref: "#/components/schemas/ChannelCoverage"
    ChannelCoverage:
      type: object
      required:
        - channelId
        - displayName
        - weeks
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        displayName:
          type: string
        weeks:
          type: array
          description: Newest week first. A week below 90 percent is flagged.
          items:
            $ref: "#/components/schemas/WeekCoverage"
    WeekCoverage:
      type: object
      required:
        - isoWeek
        - weekStart
        - shorts
        - covered
        - noSeries
        - flagged
      properties:
        isoWeek:
          type: string
          example: "2026-W45"
        weekStart:
          type: string
          format: date
        shorts:
          type: integer
        covered:
          type: integer
        noSeries:
          type: integer
        percent:
          type:
            - integer
            - "null"
          description: Null for a week without published shorts.
        flagged:
          type: boolean
    RenderBundle:
      type: object
      required:
        - channelId
        - series
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        series:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - badgeText
              - colourToken
              - openingFormula
              - hashtag
            properties:
              id:
                $ref: "#/components/schemas/Identifier"
              name:
                type: string
              badgeText:
                type: object
                additionalProperties:
                  type: string
              colourToken:
                type: string
              openingFormula:
                type: string
              hashtag:
                type: string
        callToAction:
          description: One call-to-action text per language (de, en) for all channels, each naming the join domain. Null when no join domain is configured.
          oneOf:
            - type: object
              additionalProperties:
                type: string
              required:
                - de
                - en
            - type: "null"
    AnalyticsMetricName:
      type: string
      enum:
        - views
        - engaged_views
        - average_view_percentage
        - watch_time
        - likes
        - comments
        - shares
    AnalyticsMetric:
      type: object
      description: One metric of an aggregate. A null value means no post of the group provides the metric.
      required:
        - name
        - value
        - posts
        - average
      properties:
        name:
          $ref: "#/components/schemas/AnalyticsMetricName"
        value:
          type:
            - number
            - "null"
        posts:
          type: integer
          description: How many posts contributed a value.
        average:
