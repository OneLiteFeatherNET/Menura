openapi: 3.1.0
info:
  title: Menura API
  version: 0.1.0
  summary: Content and stream tooling of OneLiteFeather.
  description: |
    Source of truth for every REST endpoint of Menura. The server serves this file unchanged on the anonymous
    documentation path /openapi/menura.yaml. Conventions for errors, identifiers, paging and timestamps are in
    CONVENTIONS.md next to this file. The skeleton defines only the health endpoint; product endpoints are added
    by their own changes.
servers:
  - url: https://api-menura.onelitefeather.net
    description: Production, behind the shared Envoy Gateway.
  - url: http://localhost:8080
    description: Local development server.
tags:
  - name: Health
    description: Anonymous liveness and readiness.
  - name: Auth
    description: Web sign-in through Menura's authorization server (backend-for-frontend session).
  - name: Calendar
    description: Calendar feed tokens for read-only calendar subscriptions.
  - name: Library
    description: Finished assets and raw material, uploaded by presigned multipart upload straight to the object storage.
  - name: Channels
    description: Channels of platform accounts, their connection through the platform's own consent, and their state. No response carries a token.
  - name: Platforms
    description: Platforms of this build, their capabilities and the audit status of their apps.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness and readiness of the server and its database.
      description: |
        Anonymous. Answers 200 when the database is reachable and 503 when it is not. The body reveals only the
        overall status and the database readiness: no version, host or configuration.
      security: []
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    get:
      tags:
        - Auth
      operationId: startSignIn
      summary: Starts a web sign-in with Entra ID.
      description: |
        Anonymous. Records the sign-in transaction on the server (state, nonce and PKCE verifier, kept as digests or
        server-side only) and redirects the browser to the Entra ID authorization endpoint. No token is issued here.
      security: []
      responses:
        "302":
          description: Redirect to Entra ID.
          headers:
            Location:
              description: The Entra ID authorization URL with state, nonce and an S256 code challenge.
              schema:
                type: string
                format: uri
          content: {}
        "503":
          description: Sign-in with Entra ID is not configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/callback:
    get:
      tags:
        - Auth
      operationId: completeSignIn
      summary: Completes a web sign-in and sets the session cookie.
      description: |
        Anonymous, reached through the redirect of Entra ID. The state must belong to a live sign-in transaction, which
        is used up by this call. On success the server holds the Menura access token and the browser receives only
        the `__Host-menura-session` cookie: Secure, HttpOnly, SameSite=Strict, Path=/ and no Domain.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Entra ID when the person refused or the sign-in failed.
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to the web app.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The __Host-menura-session cookie.
              schema:
                type: string
          content: {}
        "400":
          description: The sign-in is unknown, expired or was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Entra ID refused the sign-in or the identity could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The person holds no Menura role.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: Entra ID could not be reached or answered incorrectly.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/session:
    get:
      tags:
        - Auth
      operationId: getSession
      summary: The signed-in person and their roles.
      description: |
        Answers the person of the session cookie. Returns the subject and the Menura roles, never a token. Anonymous
        callers receive 401; the web app sends them to sign in.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: endSession
      summary: Ends the web session on the server and clears the cookie.
      description: |
        Anonymous: it works without a session too, and then only clears the cookie.
      security: []
      responses:
        "204":
          description: The session is gone; the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared __Host-menura-session cookie (Max-Age=0).
              schema:
                type: string
          content: {}
  /calendar-feed-token:
    post:
      tags:
        - Calendar
      operationId: issueCalendarFeedToken
      summary: Issue the signed-in person's calendar feed token.
      description: |
        Shows a new 256-bit token once. Issuing replaces the person's previous token, which is refused at once. The
        response is never cached.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new token. It cannot be shown again.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCalendarFeedToken"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Calendar
      operationId: revokeCalendarFeedToken
      summary: Revoke the signed-in person's calendar feed token.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The token is revoked; calendar clients using it are refused from now on.
        "401":
          $ref: "#/components/responses/Problem"
  /calendar/feed/{token}:
    get:
      tags:
        - Calendar
      operationId: getCalendarFeed
      summary: The calendar feed of a token holder, as iCalendar.
      description: |
        Read-only. The token in the path is the credential, so the route needs no session. Unknown, revoked and rotated
        tokens are refused. The body is a placeholder until the iCalendar change lands.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The calendar feed token shown once when it was issued.
          schema:
            type: string
      responses:
        "200":
          description: The calendar feed.
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions:
    post:
      tags:
        - Library
      operationId: startAssetUpload
      summary: Starts an upload of a finished asset or raw material.
      description: |
        Editor only. The declaration is checked first; a checksum already recorded for the same uploader flags the
        upload instead (state flagged, no part URLs) until it is confirmed. Otherwise a multipart upload is created in
        the private bucket and presigned part URLs are issued, none for a part above 95 MB. The media bytes go from the
        browser straight to the storage; the server never receives them.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadRequest"
      responses:
        "201":
          description: The session was created. Its state is uploading, or flagged when the checksum is a duplicate.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          description: The file is above the raw material limit, or needs more parts than the storage allows.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /asset-upload-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetUpload
      summary: The upload session with its confirmed parts and the URLs of the parts still to send.
      description: |
        Editor only, and only for the uploader; any other caller answers 404. The confirmed parts are read from the
        storage. The upload continues with nextPart. A reload returns the same session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: cancelAssetUpload
      summary: Cancels a flagged or running upload and aborts its storage upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/duplicate-confirmation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: confirmDuplicateAssetUpload
      summary: Confirms that a flagged duplicate is intended and starts its upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The upload continues; its part URLs are in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /asset-upload-sessions/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Library
      operationId: completeAssetUpload
      summary: Completes an upload and verifies the stored checksum.
      description: |
        Every part must be in the storage. The stored object's size and checksum are compared with the declaration: a
        match lists the asset as available; a mismatch fails the session, removes the object and answers 422.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset is available; assetId names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionView"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: The stored file does not match the declared size and checksum; nothing is listed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/Problem"
  /assets:
    get:
      tags:
        - Library
      operationId: listAssets
      summary: The assets the caller may see, newest first.
      description: |
        Any signed-in person who holds a Menura role. The library is one shared pool: finished assets and raw material
        alike are listed to every reader, and only verified uploads are listed. Listing carries metadata only;
        links are requested per asset.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of visible assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAsset
      summary: One asset.
      description: A hidden asset answers 404, the same as an unknown one.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Library
      operationId: deleteAsset
      summary: Deletes an asset that no post references.
      description: |
        Editor only, and an explicit request: nothing is deleted otherwise. Refused with 409 while a post references the
        asset, naming the post. Each deletion writes one audit entry.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The asset is deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assets/{id}/preview-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetPreviewLink
      summary: A short-lived signed link to preview the asset inline.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assets/{id}/download-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Library
      operationId: getAssetDownloadLink
      summary: A short-lived signed link to download the asset as an attachment.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed link. It expires at expiresAt and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedLink"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /platforms:
    get:
      tags:
        - Platforms
      operationId: listPlatforms
      summary: The platforms of this build with their capabilities, features and audit status.
      description: |
        Read by every signed-in person. The restrictions of an app that is not audited are listed with its status, so
        publishers see them before they schedule.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The platforms of this build.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Problem"
  /platforms/{platform}/audit-status:
    put:
      tags:
        - Platforms
      operationId: recordPlatformAuditStatus
      summary: Record the audit status of a platform app (administrators only).
      description: |
        Records the status with the date of the decision and its source, and writes an audit entry. An app whose status
        is unknown or unaudited cannot use public visibility.
      security:
        - sessionCookie: []
      parameters:
        - name: platform
          in: path
          required: true
          description: The platform identifier, for example youtube.
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditStatusRequest"
      responses:
        "200":
          description: The recorded audit status with its text and restrictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /channels:
    get:
      tags:
        - Channels
      operationId: listChannels
      summary: List the channels, with their connection state and quota.
      description: |
        Cursor-paged in id order. Read by every signed-in person. The representation carries no token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /channels/connections:
    post:
      tags:
        - Channels
      operationId: startChannelConnection
      summary: Start the connection of a new channel through the platform's consent.
      description: |
        Returns the platform's own consent URL. The browser is sent there; the platform returns it to the callback, and
        the server connects the channel only after the platform grants it. No credential is ever entered in Menura.
        Only a publisher or an administrator may start a connection.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      responses:
        "202":
          description: The consent URL. It carries the state of this flow only and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /channels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Channels
      operationId: getChannel
      summary: One channel with its connection state, scopes, quota and audit status.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags:
        - Channels
      operationId: disconnectChannel
      summary: Disconnect a channel; the platform grant is revoked where possible and the stored tokens are deleted.
      description: |
        The answer says what the platform did with the grant. When it reports failed, the platform grant may still
        exist and should be revoked in the platform's own settings. The stored tokens are deleted in every case.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The disconnect is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disconnection"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /channels/{id}/consent:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags:
        - Channels
      operationId: startChannelConsent
      summary: Reconnect a channel that needs reconnection, or enable further features on it, through consent.
      description: |
        The channel keeps its identity, posts and history. A consent for a different platform account is refused and the
        publisher is asked to connect a new channel. Only a publisher or an administrator may start it.
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "202":
          description: The consent URL. It carries the state of this flow only and is never cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /channel-connections/callback:
    get:
      tags:
        - Channels
      operationId: completeChannelConnection
      summary: Callback of the platform consent; sends the browser back to the channel page.
      description: |
        Called by the browser after the platform's consent. The state must belong to a live consent started by the same
        person. The answer is a redirect to the web app's channel page with the outcome; no token is ever placed in it.
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: The state of the consent, as the platform returned it.
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: The authorization code of the platform, exchanged once.
          schema:
            type: string
            maxLength: 2048
        - name: error
          in: query
          required: false
          description: The reason the platform reports when the consent was refused or cancelled.
          schema:
            type: string
            maxLength: 200
      responses:
        "302":
          description: Redirect to the channel page with connection=<outcome>, the channel and a reason when there is one.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content: {}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-menura-session
      description: The web session cookie set by the sign-in. Its value is an opaque secret, never a token.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items per page. Values above 200 are reduced to 200.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from nextCursor of the previous page. Omit it for the first page.
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: An error, described by RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Every error response carries these five members.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI that identifies the problem type; about:blank when no specific type applies.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code of the response.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence. It never contains internal details.
        instance:
          type: string
          description: The path of the request that failed.
    CursorPage:
      type: object
      description: Envelope of every cursor-paged list. nextCursor is null on the last page.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - "null"
    Identifier:
      type: string
      format: uuid
      description: A random RFC 9562 version 4 UUID. Identifiers carry no creation time and no sequence.
      example: 4f0c7a52-9d1e-4b8a-8e3f-2a6c5d7b9e10
    IssuedCalendarFeedToken:
      type: object
      description: A calendar feed token, shown once. The server keeps only its hash.
      required:
        - token
      properties:
        token:
          type: string
          description: The token as "<identifier>.<secret>"; the secret is 256 random bits.
    HealthStatus:
      type: object
      description: Overall status and database readiness. Nothing else is revealed.
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        database:
          type: string
          enum:
            - UP
            - DOWN
    SessionView:
      type: object
      description: The signed-in person. Carries no token; roles are the Menura roles the person holds.
      required:
        - subject
        - roles
      properties:
        subject:
          type: string
          description: The stable subject of the person, as issued by the authorization server.
        roles:
          type: array
          items:
            type: string
            enum:
              - VIEWER
              - EDITOR
              - PUBLISHER
              - OPERATOR
              - ADMIN
    AssetUploadRequest:
      type: object
      description: What an editor declares to start an upload. Every field is checked; a missing one is named in the problem.
      required:
        - kind
        - format
        - sizeBytes
        - checksum
        - width
        - height
      properties:
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
          description: The container or image format, in lower case (mp4, mov, webm, mkv, png, jpg, jpeg, webp or gif).
          maxLength: 16
        durationSeconds:
          type: integer
          minimum: 1
          description: Required for video and raw_material; not allowed for image. Declared by the client, never probed.
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        checksum:
          type: string
          description: The SHA-256 of the part digests, base64, then a dash and the part count, as in "base64=-3". The server compares it with the storage's own value on completion.
          pattern: "^[A-Za-z0-9+/]{43}=-[1-9][0-9]{0,4}$"
        streamTitle:
          type: string
          maxLength: 200
          description: Required for raw_material. No control or format characters.
        streamDate:
          type: string
          format: date
          description: Required for raw_material; the day of the stream.
    PartUrl:
      type: object
      description: A presigned PUT URL for one part. The browser sends the part with its x-amz-checksum-sha256 header.
      required:
        - partNumber
        - sizeBytes
        - url
        - expiresAt
      properties:
        partNumber:
          type: integer
          minimum: 1
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    UploadSessionView:
      type: object
      description: An upload session. Nullable members are always present, as null when they do not apply.
      required:
        - id
        - state
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - partSizeBytes
        - partCount
        - confirmedParts
        - parts
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            - flagged
            - uploading
            - available
            - failed
            - cancelled
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        partSizeBytes:
          type: integer
          format: int64
        partCount:
          type: integer
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        duplicateOf:
          type:
            - string
            - "null"
          format: uuid
          description: The asset the checksum already belongs to, when the upload is flagged.
        assetId:
          type:
            - string
            - "null"
          format: uuid
        failureReason:
          type:
            - string
            - "null"
          description: Why the session failed, for example checksum_mismatch.
        confirmedParts:
          type: array
          items:
            type: integer
            minimum: 1
          description: The part numbers the storage has confirmed, ascending.
        nextPart:
          type:
            - integer
            - "null"
          description: The first part not yet confirmed; null when every part is confirmed.
        parts:
          type: array
          description: Presigned URLs for the parts not yet confirmed, ascending.
          items:
            $ref: "#/components/schemas/PartUrl"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetView:
      type: object
      description: A verified asset as listed. Metadata only; links are requested separately.
      required:
        - id
        - kind
        - format
        - width
        - height
        - sizeBytes
        - checksum
        - uploaderId
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum:
            - video
            - image
            - raw_material
        format:
          type: string
        durationSeconds:
          type:
            - integer
            - "null"
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        uploaderId:
          $ref: "#/components/schemas/Identifier"
        streamTitle:
          type:
            - string
            - "null"
        streamDate:
          type:
            - string
            - "null"
          format: date
        createdAt:
          type: string
          format: date-time
    AssetPage:
      description: One cursor page of assets; the envelope is CursorPage.
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AssetView"
    SignedLink:
      type: object
      description: A signed link to one object. The storage refuses it after expiresAt.
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ChannelPage:
      type: object
      description: One page of channels. nextCursor is null on the last page.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        nextCursor:
          type:
            - string
            - "null"
    Channel:
      type: object
      description: >-
        A channel of a platform account. It has no field for a token, a secret or a token fragment; its scopes and
        expiry are separate fields.
      required:
        - id
        - platform
        - displayName
        - platformAccountId
        - state
        - features
        - grantedScopes
        - missingScopes
        - createdAt
        - updatedAt
        - quota
        - audit
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        platform:
          type: string
          description: The platform identifier, for example youtube.
        displayName:
          type: string
        platformAccountId:
          type: string
          description: The identifier of the channel at the platform.
        state:
          type: string
          enum:
            - connected
            - needs_reconnection
            - disconnected
        stateReason:
          type:
            - string
            - "null"
          description: Why the channel needs reconnection, in readable words.
        features:
          type: array
          description: The features the channel is enabled for.
          items:
            type: string
        grantedScopes:
          type: array
          description: The scopes the platform granted.
          items:
            type: string
        missingScopes:
          type: array
          description: Scopes an enabled feature needs that were not granted. Flagged, not refused.
          items:
            type: string
        grantRevocation:
          type:
            - string
            - "null"
          enum:
            - revoked
            - not_supported
            - failed
            - null
          description: What the platform did with the grant at disconnect. failed means the grant may still exist.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        quota:
          $ref: "#/components/schemas/QuotaView"
        audit:
          $ref: "#/components/schemas/AuditView"
    QuotaView:
      type: object
      description: Quota and rate-limit state of a channel, as reported or measured. Null values were never reported.
      required:
        - warning
      properties:
        used:
          type:
            - integer
            - "null"
        limit:
          type:
            - integer
            - "null"
        resetAt:
          type:
            - string
            - "null"
          format: date-time
        warning:
          type: boolean
          description: True when the used share is above the configured warning level.
        delay:
          oneOf:
            - $ref: "#/components/schemas/DelayView"
            - type: "null"
    DelayView:
      type: object
      description: A platform rate limit that delays publications until nextAttemptAt.
      required:
        - reason
        - nextAttemptAt
      properties:
        reason:
          type: string
        nextAttemptAt:
          type: string
          format: date-time
    AuditView:
      type: object
      description: The audit status of a platform app, its readable text and the restrictions it implies.
      required:
        - status
        - displayText
        - restrictions
      properties:
        status:
          type: string
          enum:
            - unknown
            - unaudited
            - audited
        displayText:
          type: string
          example: "unaudited: uploads private only"
        restrictions:
          type: array
          items:
            type: string
          example:
            - public visibility not available
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
        source:
          type:
            - string
            - "null"
    Platform:
      type: object
      description: A platform of this build with what it supports and the features a channel can enable.
      required:
        - platform
        - displayName
        - capabilities
        - features
        - audit
      properties:
        platform:
          type: string
        displayName:
          type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        audit:
          $ref: "#/components/schemas/AuditView"
    Capabilities:
      type: object
      description: What the platform offers and what this build supports.
      required:
        - publishing
        - nativeScheduling
        - listing
        - metrics
        - revocation
      properties:
        publishing:
          type: boolean
        nativeScheduling:
          type: boolean
        listing:
          type: boolean
        metrics:
          type: boolean
        revocation:
          type: boolean
    Feature:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    Authorization:
      type: object
      description: The platform's consent URL. It carries the state of this flow only.
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
    ConnectRequest:
      type: object
      description: A new connection. Features are optional and must be declared by the platform.
      required:
        - platform
      properties:
        platform:
          type: string
          maxLength: 40
          pattern: "^[a-z][a-z0-9_-]{0,39}$"
        features:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,39}$"
    ConsentRequest:
      type: object
      description: Features to enable on a reconnection. Omitting them keeps the channel's features.
      properties:
        features:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,39}$"
    Disconnection:
      type: object
      description: The outcome of a disconnect at the platform.
      required:
        - revocation
      properties:
        revocation:
          type: string
          enum:
            - revoked
            - not_supported
            - failed
    AuditStatusRequest:
      type: object
      description: The audit status of a platform app and its source.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - unknown
            - unaudited
            - audited
        source:
          type: string
          maxLength: 200
          description: Where the decision came from, for example the audit letter or the console review.
