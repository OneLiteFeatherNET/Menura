              $ref: "#/components/schemas/SeriesRequest"
      responses:
        "200":
          description: The stored series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /external-posts/{id}/series:
    parameters:
      - name: id
        in: path
        required: true
        description: The external post identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      tags:
        - Series
      operationId: assignExternalPostSeries
      summary: Assigns a post to a series or marks it "no series". Only the editor role.
      description: |
        Moving a post that already belongs to a series, or carries the no-series mark, needs replace set to true; without it
        the request is refused with 409 and nothing changes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesAssignRequest"
      responses:
        "200":
          description: The decision on the post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /channels/{id}/series-render-bundle:
    parameters:
      - name: id
        in: path
        required: true
        description: The channel identifier.
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags:
        - Series
      operationId: getSeriesRenderBundle
      summary: The active series and one call to action of a channel, for the external renderer.
      description: |
        Readable by the renderer's operator role only. The call to action names the join domain when one is configured;
        without a join domain the bundle carries no call to action and no error.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The render bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderBundle"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /analytics/overview:
    get:
      tags:
        - Analytics
      operationId: getAnalyticsOverview
      summary: Totals of the posts published in a period, across channels, per channel and per format, with the last collection of every channel.
      description: |
        Aggregates read the latest value of each metric of each post. An unavailable metric is null with a count of zero,
        never zero. Averages are taken for the average view percentage, sums for every other metric.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /analytics/series:
    get:
      tags:
        - Analytics
      operationId: getAnalyticsSeries
      summary: The series comparison of a period, per series and per ISO week, ranked by engaged views.
      description: Posts in no series form one row with a null series. Series the caller may not see are left out.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSeriesComparison"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /analytics/equal-age:
    get:
      tags:
        - Analytics
      operationId: getAnalyticsEqualAge
      summary: The median of one metric per publish hour or weekday, at equal age.
      description: |
        Each post is compared at the same age through its snapshot at the chosen offset. Posts younger than the offset have
        no snapshot and are not counted. The hour and weekday are in Europe/Berlin.
      security:
        - sessionCookie: []
      parameters:
        - name: metric
          in: query
          required: false
          description: The metric to compare. Default views.
          schema:
            $ref: "#/components/schemas/AnalyticsMetricName"
        - name: offsetHours
          in: query
          required: false
          description: >-
            The offset in hours: 1, 2, 4, 8, 24, 48 or 168 (seven days), or a whole number of days from 8 to 365 times 24.
            Default 24.
          schema:
            type: integer
            minimum: 1
            maximum: 8760
            default: 24
        - name: by
          in: query
          required: false
          description: hour (24 slots, 0 to 23) or weekday (7 slots, 1 is Monday). Default hour.
          schema:
            type: string
            enum:
              - hour
              - weekday
            default: hour
        - name: channelId
          in: query
          required: false
          description: Restricts the comparison to the posts of one channel.
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEqualAge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /analytics/external-posts/{id}:
    get:
      tags:
        - Analytics
      operationId: getAnalyticsExternalPost
      summary: The latest values and the snapshots of one external post.
      security:
        - sessionCookie: []
      parameters:
