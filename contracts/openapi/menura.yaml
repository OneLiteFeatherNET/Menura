          type: string
          maxLength: 253
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$"
          description: One lower-case host name, for example onelitefeather.net.
        attributionWindowHours:
          type: integer
          minimum: 1
          maximum: 720
          description: The window in whole hours; absent keeps the current value.
    JoinSettings:
      type: object
      required:
        - joinDomain
        - attributionWindowHours
        - updatedAt
      properties:
        joinDomain:
          type:
            - string
            - "null"
          description: The join domain, or null when none is configured.
        attributionWindowHours:
          type: integer
          description: The attribution window in hours, 72 by default.
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    JoinStatedFigure:
      type: object
      description: The first joins of one period that named this source. The label says what the figure is.
      required:
        - source
        - joins
        - label
      properties:
        source:
          $ref: "#/components/schemas/JoinStatedSource"
        joins:
          type: integer
        label:
          type: string
          enum:
            - stated by players
    JoinPeriod:
      type: object
      required:
        - start
        - end
        - total
        - unanswered
        - answerRate
        - stated
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        total:
          type: integer
          description: All first joins of the period.
        unanswered:
          type: integer
          description: The total minus the stated sources.
        answerRate:
          type:
            - number
            - "null"
          description: The answered share in percent, null for a period without first joins.
        stated:
          type: array
          items:
            $ref: "#/components/schemas/JoinStatedFigure"
    JoinNewPlayers:
      type: object
      required:
        - grouping
        - from
        - to
        - periods
      properties:
        grouping:
          type: string
          enum:
            - day
            - week
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        periods:
          type: array
          items:
            $ref: "#/components/schemas/JoinPeriod"
    JoinPostEstimate:
      type: object
      description: The estimated first joins of one post. Always an estimate.
      required:
        - postId
        - estimatedFirstJoins
        - windowHours
        - label
      properties:
        postId:
          $ref: "#/components/schemas/Identifier"
        estimatedFirstJoins:
          type: number
        windowHours:
          type: integer
        label:
          type: string
          enum:
            - estimate
    JoinSeriesEstimate:
      type: object
      required:
        - seriesId
        - name
        - estimatedFirstJoins
      properties:
        seriesId:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: The series, or null for the posts without a series.
        name:
          type: string
          description: The name of the series, or "no series".
        estimatedFirstJoins:
          type: number
    JoinSeriesEstimates:
      type: object
      required:
        - from
        - to
        - label
        - series
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        label:
          type: string
          enum:
            - estimate
        series:
          type: array
          items:
            $ref: "#/components/schemas/JoinSeriesEstimate"
    YouTubeMadeForKids:
      type: object
      description: The made-for-kids declaration of a YouTube video (status.selfDeclaredMadeForKids).
      required:
        - madeForKids
      properties:
        madeForKids:
          type: boolean
