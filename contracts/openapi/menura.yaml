      enum:
        - draft
        - in_review
        - approved
        - scheduled
        - published
        - failed
    PostVisibility:
      type: string
      enum:
        - private
        - unlisted
        - public
    PostDraftRequest:
      type: object
      description: A new draft. Fields not given are filled from the series when one is named.
      required:
        - channelId
        - assetId
        - title
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        assetId:
          $ref: "#/components/schemas/Identifier"
        coverAssetId:
          type:
            - string
            - "null"
          format: uuid
          description: A finished image of the upload, shown as the cover.
        seriesId:
          type:
            - string
            - "null"
          format: uuid
        sourcePostId:
          type:
            - string
            - "null"
          format: uuid
          description: The post this one recycles. Its asset must be the same asset; the source is not changed.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
            - string
            - "null"
          maxLength: 5000
        hashtags:
          type:
            - array
            - "null"
          maxItems: 30
          items:
            type: string
        visibility:
          oneOf:
            - $ref: "#/components/schemas/PostVisibility"
            - type: "null"
        scheduledAt:
          type:
            - string
            - "null"
          format: date-time
    PostPatch:
      type: object
      description: The fields to change. A field that is absent is unchanged.
      properties:
        channelId:
          $ref: "#/components/schemas/Identifier"
        coverAssetId:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        hashtags:
          type: array
          maxItems: 30
          items:
            type: string
        visibility:
          $ref: "#/components/schemas/PostVisibility"
        scheduledAt:
          type: string
          format: date-time
    PostStep:
      type: object
      description: One publication step of a post, with its state, the time of its last change and its reason when failed.
      required:
        - step
        - state
        - changedAt
        - reason
      properties:
        step:
          type: string
          enum:
            - upload
            - schedule
            - metadata
            - publish
        state:
          type: string
          enum:
            - pending
            - running
            - done
            - failed
        changedAt:
          type: string
          format: date-time
        reason:
          type:
            - string
            - "null"
    DryRunProblem:
      type: object
      description: A problem the schedule dry run found on a post. A warning does not block; an error does.
      required:
        - code
        - severity
        - message
        - action
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
        message:
          type: string
        action:
          type:
            - string
            - "null"
          enum:
            - reconnect
            - null
    PostAttempt:
      type: object
      description: One publication attempt. An attempt without an outcome stopped before the platform answered.
      required:
        - attempt
        - startedAt
        - finishedAt
        - outcome
        - reason
      properties:
        attempt:
          type: integer
          minimum: 1
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        outcome:
          type:
            - string
            - "null"
          enum:
            - handed_over
            - published
            - retry_scheduled
            - failed
            - unknown
            - null
        reason:
          type:
            - string
            - "null"
    Post:
      type: object
      description: >-
        A finished asset planned onto one channel: its per-channel text, hashtags, cover and time, its status, its
        publication steps and attempts, and the problems of its dry run. A post carries no credential.
      required:
        - id
        - channelId
        - channelName
        - platform
        - channelState
        - assetId
        - coverAssetId
        - seriesId
        - sourcePostId
        - authorId
        - status
        - title
        - description
        - hashtags
        - visibility
        - playlistId
        - scheduledAt
        - handedOverAt
        - approvedBy
        - approvedAt
        - publishedAt
        - url
        - externalId
        - failureReason
        - attempts
        - nextAttemptAt
        - revision
        - steps
        - attemptHistory
        - problems
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        channelId:
          $ref: "#/components/schemas/Identifier"
        channelName:
          type: string
        platform:
          type: string
        channelState:
          type: string
          enum:
            - connected
            - needs_reconnection
            - disconnected
        assetId:
          $ref: "#/components/schemas/Identifier"
        coverAssetId:
          type:
            - string
            - "null"
          format: uuid
        seriesId:
          type:
            - string
            - "null"
          format: uuid
        sourcePostId:
          type:
            - string
            - "null"
          format: uuid
        authorId:
          $ref: "#/components/schemas/Identifier"
        status:
          $ref: "#/components/schemas/PostStatus"
        title:
          type: string
        description:
          type: string
        hashtags:
          type: array
          items:
            type: string
        visibility:
          $ref: "#/components/schemas/PostVisibility"
        playlistId:
          type:
            - string
            - "null"
        scheduledAt:
          type:
            - string
            - "null"
          format: date-time
        handedOverAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the platform accepted the post for its own timed publication. Null for a job publication.
        approvedBy:
          type:
            - string
            - "null"
          format: uuid
        approvedAt:
          type:
            - string
            - "null"
          format: date-time
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        url:
          type:
            - string
            - "null"
          description: The public URL of the published item. Null until the post is published.
        externalId:
          type:
            - string
            - "null"
          description: The platform identifier of the item, once the platform has it.
        failureReason:
          type:
            - string
            - "null"
          description: The fixed text of the last failure, with no credential and no response body.
        attempts:
          type: integer
          minimum: 0
        nextAttemptAt:
          type:
            - string
            - "null"
          format: date-time
        revision:
          type: integer
          minimum: 0
          description: Grows with every change of the post. The calendar feed uses it as the event sequence.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PostStep"
        attemptHistory:
          type: array
          items:
            $ref: "#/components/schemas/PostAttempt"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/DryRunProblem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
