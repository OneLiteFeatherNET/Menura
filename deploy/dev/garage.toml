# Garage single-node configuration for the local development stack.
# Secrets are not kept here: the compose file points GARAGE_RPC_SECRET_FILE and
# GARAGE_ADMIN_TOKEN_FILE at the garage-secrets volume, written by garage-secrets.sh.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# One node, one copy: the development stack has no redundancy to offer.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
