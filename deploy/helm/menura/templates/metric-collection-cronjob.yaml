{{- if .Values.jobs.metricCollection.enabled }}
# Collects the metrics of every external post and takes the snapshots at fixed offsets (change add-content-analytics).
# The run reads the token keys and the platform apps from channels.existingSecret through envFrom; it prints counts only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "menura.fullname" . }}-metric-collection
  labels:
    {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 4 }}
spec:
  schedule: {{ .Values.jobs.metricCollection.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "menura.podSecurity" . | nindent 10 }}
          containers:
            - name: metric-collection
              image: {{ include "menura.image" (dict "root" . "component" "jobs") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - jobs
                - run
                - metric-collection
              env:
                {{- include "menura.databaseEnv" . | nindent 16 }}
                {{- include "menura.channelEnv" . | nindent 16 }}
                - name: MENURA_ANALYTICS_TIME_ZONE
                  value: {{ .Values.analytics.timeZone | quote }}
              {{- include "menura.secretEnvFrom" . | nindent 14 }}
              {{- include "menura.containerSecurity" . | nindent 14 }}
              {{- with .Values.jobs.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
