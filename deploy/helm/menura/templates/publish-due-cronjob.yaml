{{- if .Values.jobs.publishDue.enabled }}
# Publishes the due scheduled posts (change add-content-distribution, jobs run publish-due). Each run claims the due posts
# with leases, so two runs never publish one post; the CronJob runs one job at a time (parallelism 1, concurrencyPolicy
# Forbid). The run reads the token keys and the platform apps from channels.existingSecret, and the finished assets from
# object storage with the storage credentials (storage.existingSecret), both through envFrom; it prints counts only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "menura.fullname" . }}-publish-due
  labels:
    {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 4 }}
spec:
  schedule: {{ .Values.jobs.publishDue.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      parallelism: 1
      template:
        metadata:
          labels:
            {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "menura.podSecurity" . | nindent 10 }}
          containers:
            - name: publish-due
              image: {{ include "menura.image" (dict "root" . "component" "jobs") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - jobs
                - run
                - publish-due
              env:
                - name: MENURA_PUBLISH_MAX_ATTEMPTS
                  value: {{ .Values.jobs.publishDue.maxAttempts | quote }}
                - name: MENURA_PUBLISH_RETRY_DELAY
                  value: {{ .Values.jobs.publishDue.retryDelay | quote }}
                - name: MENURA_PUBLISH_HANDOVER_LEAD
                  value: {{ .Values.jobs.publishDue.handoverLead | quote }}
                - name: MENURA_PUBLISH_BATCH_SIZE
                  value: {{ .Values.jobs.publishDue.batchSize | quote }}
                - name: MENURA_PUBLISH_LEASE
                  value: {{ .Values.jobs.publishDue.lease | quote }}
                - name: MENURA_CALENDAR_TIME_ZONE
                  value: {{ .Values.calendar.timeZone | quote }}
                {{- include "menura.databaseEnv" . | nindent 16 }}
                {{- include "menura.channelEnv" . | nindent 16 }}
                {{- include "menura.libraryEnv" . | nindent 16 }}
              {{- include "menura.publishJobSecretEnvFrom" . | nindent 14 }}
              {{- include "menura.containerSecurity" . | nindent 14 }}
              {{- with .Values.jobs.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
