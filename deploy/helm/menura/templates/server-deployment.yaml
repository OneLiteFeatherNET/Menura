apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "menura.fullname" . }}-server
  labels:
    {{- include "menura.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "menura.componentSelectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "menura.componentLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "menura.podSecurity" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "menura.image" (dict "root" . "component" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.server.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
          env:
            {{- include "menura.databaseEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.server.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- include "menura.databaseEnvFrom" . | nindent 10 }}
          {{- include "menura.containerSecurity" . | nindent 10 }}
          # /health is anonymous and answers both probes (principle 7 and
          # the health endpoint of add-project-skeleton).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
