{{- if .Values.jobs.externalPostSync.enabled }}
# Imports and re-syncs the existing posts of connected channels (change add-external-post-import). The run reads the
# token keys and the platform apps from channels.existingSecret through envFrom; it prints counts only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "menura.fullname" . }}-external-post-sync
  labels:
    {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 4 }}
spec:
  schedule: {{ .Values.jobs.externalPostSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "menura.componentLabels" (dict "root" . "component" "jobs") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "menura.podSecurity" . | nindent 10 }}
          containers:
            - name: external-post-sync
              image: {{ include "menura.image" (dict "root" . "component" "jobs") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - jobs
                - run
                - external-post-sync
              env:
                - name: MENURA_EXTERNAL_POST_SYNC_INTERVAL
                  value: {{ .Values.jobs.externalPostSync.interval | quote }}
                {{- include "menura.databaseEnv" . | nindent 16 }}
                {{- include "menura.channelEnv" . | nindent 16 }}
              {{- include "menura.secretEnvFrom" . | nindent 14 }}
              {{- include "menura.containerSecurity" . | nindent 14 }}
              {{- with .Values.jobs.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
