{{- if .Values.httpRoute.enabled }}
{{- $name := include "menura.fullname" . -}}
{{- /*
Rate limits per route on the shared Envoy Gateway. The chart renders no ClientTrafficPolicy (TLS 1.3 and the client
address live on the shared listener, owned by the cluster repository: see README.md, "Shared listener") and no
SecurityPolicy (CORS is answered only by the server, so no second Access-Control-Allow-Origin can appear).
*/ -}}
{{- range $route, $cfg := .Values.routes }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}-{{ $route }}-ratelimit
  labels:
    {{- include "menura.componentLabels" (dict "root" $ "component" $route) | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}-{{ $route }}
  rateLimit:
    type: Local
    local:
      rules:
        # One Distinct rule per address family: every client address gets its own budget.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: "0.0.0.0/0"
          limit:
            requests: {{ $cfg.rateLimit.perIPPerMinute }}
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: "::/0"
          limit:
            requests: {{ $cfg.rateLimit.perIPPerMinute }}
            unit: Minute
        {{- if $cfg.rateLimit.perClientPerMinute }}
        # One budget per Authorization token: the client of the API and of the MCP endpoint.
        - clientSelectors:
            - headers:
                - name: Authorization
                  type: Distinct
          limit:
            requests: {{ $cfg.rateLimit.perClientPerMinute }}
            unit: Minute
        {{- end }}
  # Envoy's own refusal (plain text) becomes Problem Details with Retry-After. The server's refusals of the person
  # budget already carry their own Problem Details and Retry-After, and do not match this rule.
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 429
        responseHeaders:
          - name: content-type
            type: Exact
            value: text/plain
      response:
        contentType: application/problem+json
        body:
          type: Inline
          inline: '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"The request rate of this client is over its limit."}'
        header:
          set:
            - name: Retry-After
              value: "60"
{{- end }}
{{- end }}
