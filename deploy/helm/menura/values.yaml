# Default values for the Menura chart.
#
# Holds no secrets. Credentials are read from Secrets that exist before the
# release (database.existingSecret), and every other setting is an environment
# variable with a value here or a local default in the application.

nameOverride: ""
fullnameOverride: ""

# Images are built from this repository and pushed to the OLF Harbor. An empty
# tag means the chart's appVersion, so a chart release deploys images built
# from the same release. Each component sets its own repository below.
image:
  tag: ""
  pullPolicy: IfNotPresent

# Names of existing image pull Secrets, applied to every pod (server, jobs, web
# and the migrate hook). The OLF Harbor project needs `harbor-pull`. Empty means
# the pods pull without credentials, which works only for public images.
imagePullSecrets: []

# Every component listens on this port inside its container.
httpPort: 8080

database:
  # JDBC URL of the PostgreSQL 17 cluster (OLF CloudNativePG). No credentials.
  url: jdbc:postgresql://menura-postgres-rw:5432/menura
  # Existing Secret with the keys MENURA_DB_USER and MENURA_DB_PASSWORD, created
  # outside this chart and injected into every server, jobs and migrate pod.
  # Empty means the pods get no credentials and the database cannot be reached.
  existingSecret: ""

# Object storage of the library (finished assets and raw material): the OLF Ceph RGW through its S3 API, on the public
# host (principle 14). The bucket is private and the browser sends parts straight to the endpoint, so its CORS rule
# allows the web app origin only. Credentials are not values: they come from an existing Secret with the keys
# MENURA_S3_ACCESS_KEY_ID and MENURA_S3_SECRET_ACCESS_KEY, injected into the server pods only.
storage:
  endpoint: https://s3.onelitefeather.net
  region: default
  bucket: menura
  existingSecret: ""

# Library limits and lifetimes, each an environment variable of the server (see application.yml). The part size may
# not exceed 95 MB (principle 15): the Cloudflare request-body limit is 100 MB. The raw material limit defaults to 50 GiB.
# Presigned part URLs and signed links are short-lived by design.
library:
  partSizeBytes: 99614720
  rawMaterialMaxBytes: 53687091200
  uploadUrlLifetime: PT15M
  linkLifetime: PT5M

# The server: REST API, backend-for-frontend, OAuth authorization server,
# SSE feeds and the MCP endpoint. It never transcodes or renders video.
server:
  image:
    repository: harbor.onelitefeather.dev/onelitefeather/menura-server
  replicaCount: 1
  # Empty uses the image's own entrypoint.
  command: []
  env:
    # Production profile: Flyway does not run at server start (migrate hook).
    MICRONAUT_ENVIRONMENTS: prod
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# The web app: the Vue 3 single-page app as static files, served separately
# from the server.
web:
  image:
    repository: harbor.onelitefeather.dev/onelitefeather/menura-web
  replicaCount: 1
  command: []
  env: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Jobs: the same codebase as Kubernetes CronJob entry points. Each run names one
# job (`jobs run <name>`). The skeleton has only `ping`, and the deployment
# stays at zero replicas until a long-running job exists; scheduled jobs come
# with the changes that add them.
jobs:
  image:
    repository: harbor.onelitefeather.dev/onelitefeather/menura-jobs
  replicaCount: 0
  command:
    - jobs
    - run
    - ping
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # The channel health job (CronJob): refreshes connected channels' tokens before they expire and marks rejected
  # grants as needing reconnection. Needs channels.existingSecret; without it every run fails at once.
  channelHealth:
    enabled: true
    schedule: "*/15 * * * *"
  # The external post sync (CronJob, change add-external-post-import): imports the existing posts of connected channels
  # and re-syncs them. A channel whose last complete sync is newer than interval (ISO-8601) is skipped. Needs
  # channels.existingSecret, like channelHealth.
  externalPostSync:
    enabled: true
    schedule: "17 */6 * * *"
    interval: PT6H

  # The retention CronJob (jobs run retention, change add-content-library). It is rendered only when enabled, and the
  # policy itself is switched on separately, so a deployment can render the job and keep the policy off.
  #   policyEnabled  -> MENURA_RETENTION_ENABLED: true moves raw recordings older than rawMaxAge to cold storage.
  #   rawMaxAge      -> MENURA_RETENTION_RAW_MAX_AGE: an ISO-8601 duration, P30D by default.
  #   batchSize      -> MENURA_RETENTION_BATCH_SIZE: items per run, 1 to 1000, 100 by default.
  # The object storage credentials come from storage.existingSecret, as for the server.
  retention:
    enabled: false
    schedule: "30 3 * * *"
    policyEnabled: false
    rawMaxAge: P30D
    batchSize: 100

# Channel connections (change add-channel-connections). The server and the channel health job read these from an
# existing Secret created outside this chart, with the keys MENURA_TOKEN_ENCRYPTION_KEY (required; the server does not
# start without it), MENURA_YOUTUBE_CLIENT_ID and MENURA_YOUTUBE_CLIENT_SECRET, and optionally
# MENURA_TOKEN_ENCRYPTION_KEY_PREVIOUS during a key rotation. The chart holds no secret value. See README.md.
channels:
  existingSecret: ""
  youtube:
    # The redirect URI registered in the YouTube app (Google Cloud). It is the public callback of the API host.
    redirectUri: https://api-menura.onelitefeather.net/channel-connections/callback
  # A grant whose access token expires within this margin is refreshed (ISO-8601 duration).
  refreshMargin: PT10M

# Gateway API routes attach to the shared Envoy Gateway listener (the `eg`
# Gateway in namespace `envoy` of the cluster repository).
gateway:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https

# HTTPRoutes for the public hosts. Set httpRoute.enabled to false when the hosts are
# exposed another way (for example by a Cloudflare Tunnel Ingress in the cluster
# overlay); then the chart renders no HTTPRoute and no edge policy. When enabled, exactly
# three routes are rendered: each host forwards to one Service, the web app to
# `web`, the API and the MCP endpoint to `server`. The rate limits of each route
# come from its own keys below; see README.md.
httpRoute:
  enabled: true

routes:
  web:
    hostname: menura.onelitefeather.net
    service: web
    rateLimit:
      # Requests per minute from one client address.
      perIPPerMinute: 600
  api:
    hostname: api-menura.onelitefeather.net
    service: server
    rateLimit:
      perIPPerMinute: 300
      # Requests per minute per Authorization token (the client).
      perClientPerMinute: 120
  mcp:
    hostname: mcp-menura.onelitefeather.net
    service: server
    rateLimit:
      perIPPerMinute: 300
      perClientPerMinute: 120

# Edge headers on the shared Envoy Gateway (principles 11, 14 and 15). CORS is answered by the server only, and
# TLS 1.3 and the client address are set on the shared listener by the cluster (see README.md).
edge:
  # Sent on every route: HSTS, no referrer, no MIME sniffing.
  responseHeaders:
    Strict-Transport-Security: max-age=31536000
    Referrer-Policy: no-referrer
    X-Content-Type-Options: nosniff
